<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fix Numbers — Makhanani LTSM</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 min-h-screen"><div class="max-w-3xl mx-auto p-4"><div class="bg-white rounded-2xl p-4 flex gap-3 items-center"><img src="logo.png" class="h-12 w-12 rounded-xl border-2 border-yellow-400 p-1" alt="Makhanani LTSM Logo"><div><h1 class="font-black text-2xl">🔧 Fix Numbers — WHS-000001 → WHS000001</h1><p class="text-sm text-gray-500">Removes hyphens from old book numbers + learner IDs. Run once.</p></div></div><div class="bg-white rounded-2xl p-4 mt-4"><select id="schoolSel" class="border-2 rounded-lg px-3 py-2 font-bold"><option value="WHS|700310854|Wordsworth High School">Wordsworth High School</option><option value="GSH|911360870|George Sonto High School">George Sonto High School</option></select><button id="fixBtn" type="button" class="bg-red-600 text-white px-6 py-2 rounded-lg font-bold ml-2">🔧 Fix All Numbers Now</button><p id="msg" class="text-sm font-bold mt-2"></p></div><div class="flex gap-2 mt-4"><a href="index.html" class="bg-yellow-500 text-black px-4 py-2 rounded-lg font-bold text-sm">🏠 Home</a></div></div>
<script>
(function(){
let cur={prefix:'WHS',emis:'700310854',name:'Wordsworth High School'};
document.getElementById('schoolSel').addEventListener('change',function(){ let v=this.value.split('|'); cur={prefix:v[0],emis:v[1],name:v[2]}; });
document.getElementById('fixBtn').addEventListener('click',function(){
  let fixed=0;
  ['_makhanani_ltsm','_makhanani_learners','_makhanani_history'].forEach(suffix=>{
    let key='EMIS_'+cur.emis+suffix; let arr=[]; try{ arr=JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){} 
    arr.forEach(item=>{
      if(item.copies) item.copies.forEach(c=>{ if(c.barcode && c.barcode.includes('-')){ c.barcode=c.barcode.replace(/-/g,''); fixed++; } });
      if(item.barcode && item.barcode.includes('-')){ item.barcode=item.barcode.replace(/-/g,''); fixed++; }
      if(item.bookNo && item.bookNo.includes('-')){ item.bookNo=item.bookNo.replace(/-/g,''); fixed++; }
      if(item.id && item.id.includes('-')){ item.id=item.id.replace(/-/g,''); fixed++; }
      if(item.learnerId && item.learnerId.includes('-')){ item.learnerId=item.learnerId.replace(/-/g,''); fixed++; }
    });
    localStorage.setItem(key, JSON.stringify(arr)); localStorage.setItem('makhanani_'+cur.prefix+suffix, JSON.stringify(arr));
  });
  document.getElementById('msg').innerHTML='✅ Fixed '+fixed+' numbers. Go to Home — barcodes now WHS000001 format.';
});
})();
</script>
</body></html>
