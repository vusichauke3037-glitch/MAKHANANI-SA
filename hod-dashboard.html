<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HOD Dashboard — Makhanani LTSM</title><script src="https://cdn.tailwindcss.com"></script><script src="subscription-guard.js"></script></head>
<body class="bg-gray-100 min-h-screen">
<div class="bg-black text-white py-2 px-4 flex items-center gap-3 sticky top-0 z-50"><img src="logo.png" class="h-10 w-10 rounded-full bg-white border-2 border-yellow-400 p-1" alt="Makhanani LTSM Logo"><div><div class="font-black">XINTIMANI <span class="text-yellow-500">GROUP</span> • HOD</div><div class="text-[11px] text-gray-300" id="topStatus">Loading...</div></div><div class="ml-auto flex gap-2 flex-wrap"><a href="index.html" class="bg-yellow-500 text-black px-3 py-1 rounded font-bold text-xs">🏠 Home</a></div></div>
<div class="max-w-6xl mx-auto p-4">
<div class="bg-white rounded-2xl p-4"><h1 class="font-black text-2xl">📋 HOD Dashboard</h1><p class="text-xs text-gray-500" id="schoolLine">Loading...</p></div>
<div id="subBanner" class="bg-blue-50 border-2 border-blue-300 rounded-2xl p-3 mt-4 text-sm font-bold hidden"></div>
<div class="bg-white rounded-2xl p-4 mt-4"><h2 class="font-black">📋 Requests — My Subjects — Approve / Reject</h2><p class="text-xs text-gray-500">HOD sees only requests for their subjects. If your subjects are General, you see all.</p><div id="reqList" class="mt-2 text-sm"></div></div>
<div class="bg-white rounded-2xl p-4 mt-4"><h2 class="font-black">📚 Stock — My Subjects</h2><div id="stockList" class="mt-2 text-sm"></div></div>
<div class="bg-white rounded-2xl p-4 mt-4"><h2 class="font-black">📦 Issue / Return — View</h2><div id="issueList" class="mt-2 text-sm"></div><a href="issue.html" class="inline-block bg-green-600 text-white px-4 py-2 rounded-lg font-bold text-sm mt-2">📦 Open Issue / Return →</a></div>
</div>
<script>
(function(){
let cur=null;
function render(){
  try{ cur=JSON.parse(localStorage.getItem('makhanani_session')||'null'); }catch(e){ cur=null; }
  if(!cur){ document.getElementById('schoolLine').innerHTML='❌ NOT LOGGED IN — <a href="login.html" class="underline text-blue-600 font-black">Go to login</a>'; return; }
  let sc=window.checkSubscription?window.checkSubscription(cur.school, cur.emis, {block:true}):null; if(sc && sc.locked && !sc.adminBypass) return;
  document.getElementById('topStatus').textContent=cur.name+' • '+cur.role+' • '+cur.school+' • EMIS '+cur.emis;
  document.getElementById('schoolLine').innerHTML='School: <b>'+cur.school+'</b> • EMIS: <b>'+cur.emis+'</b> • Subjects: <b>'+(cur.subjects||[]).join(', ')+'</b>';
  if(window.showSubBanner) window.showSubBanner('subBanner', cur.school, cur.emis);
  let books=[]; let requests=[]; let issues=[];
  try{ books=JSON.parse(localStorage.getItem('EMIS_'+cur.emis+'_makhanani_ltsm')||'[]'); }catch(e){}
  try{ requests=JSON.parse(localStorage.getItem('EMIS_'+cur.emis+'_makhanani_requests')||'[]'); }catch(e){}
  try{ issues=JSON.parse(localStorage.getItem('EMIS_'+cur.emis+'_makhanani_issues')||'[]'); }catch(e){}
  let mySubs=cur.subjects||[]; let isGeneral=mySubs.includes('General');
  let filteredReq=isGeneral?requests:requests.filter(r=>mySubs.some(s=> (r.subject||'').toLowerCase().includes(s.toLowerCase()) || (r.title||'').toLowerCase().includes(s.toLowerCase())));
  document.getElementById('reqList').innerHTML=filteredReq.map((r)=>{ let idx=requests.indexOf(r); return '<div class="border rounded p-2 mb-1 flex justify-between gap-2 flex-wrap"><div><b>'+r.title+'</b> • Subject '+(r.subject||'—')+' • By '+r.by+' • Grade '+r.grade+' • Qty '+r.qty+' • <b>'+r.status+'</b></div><div class="flex gap-1"><button data-approve="'+idx+'" class="approve-btn bg-green-600 text-white px-2 py-1 rounded text-xs font-bold">✅ Approve</button><button data-reject="'+idx+'" class="reject-btn bg-red-600 text-white px-2 py-1 rounded text-xs font-bold">❌ Reject</button></div></div>'; }).join('')||'<p class="text-gray-500">No requests for your subjects.</p>';
  document.querySelectorAll('.approve-btn').forEach(b=>b.addEventListener('click',function(){ let i=parseInt(this.getAttribute('data-approve')); requests[i].status='Approved'; localStorage.setItem('EMIS_'+cur.emis+'_makhanani_requests', JSON.stringify(requests)); render(); }));
  document.querySelectorAll('.reject-btn').forEach(b=>b.addEventListener('click',function(){ let i=parseInt(this.getAttribute('data-reject')); requests[i].status='Rejected'; localStorage.setItem('EMIS_'+cur.emis+'_makhanani_requests', JSON.stringify(requests)); render(); }));
  let myBooks=isGeneral?books:books.filter(b=>mySubs.some(s=> (b.subject||'').toLowerCase().includes(s.toLowerCase())));
  document.getElementById('stockList').innerHTML=myBooks.map(b=>'<div class="border rounded p-2 mb-1"><b>'+b.title+'</b> • '+(b.subject||'')+' • Grade '+(b.grade||'')+' • Copies '+(b.copies||[]).length+' • Available '+(b.copies||[]).filter(c=>c.status==='Available').length+' • Book Numbers: '+((b.copies||[]).slice(0,3).map(c=>c.barcode).join(', '))+'</div>').join('')||'<p class="text-gray-500">No books for your subjects.</p>';
  document.getElementById('issueList').innerHTML=issues.slice(-10).reverse().map(i=>'<div class="border rounded p-2 mb-1">Book <b>'+i.barcode+'</b> • Learner <b>'+i.learnerId+'</b> • '+i.action+' • '+(i.date||'')+'</div>').join('')||'<p class="text-gray-500">No issues yet.</p>';
}
render();
})();
</script>
</body></html>
