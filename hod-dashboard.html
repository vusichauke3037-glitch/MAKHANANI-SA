<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HOD — Makhanani LTSM</title><script src="https://cdn.tailwindcss.com"></script><script src="subscription-guard.js"></script><script src="impersonate-banner.js"></script>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"}}</script>
<style>@media print{ body *{visibility:hidden!important;} #printArea,#printArea *{visibility:visible!important;} #printArea{position:absolute;left:0;top:0;width:100%;padding:20px;font-family:Arial,sans-serif;color:#000;background:#fff;} #printArea table{width:100%;border-collapse:collapse;font-size:12px;} #printArea th,#printArea td{border:1px solid #000;padding:6px;text-align:left;} } #printArea{display:none;} @media print{ #printArea{display:block!important;} }</style></head>
<body class="bg-gray-100 min-h-screen"><div id="printArea"></div>
<div id="impBanner" style="display:none; background:#dc2626; color:white; text-align:center; padding:10px; font-weight:900; font-size:13px; position:sticky; top:0; z-index:9999;">👀 SUPER ADMIN VIEWING AS <span id="impName"></span> — <button onclick="returnToSuperAdmin()" style="background:white; color:#dc2626; padding:4px 12px; border-radius:999px; font-weight:900; margin-left:8px;">🔙 RETURN TO SUPER ADMIN</button></div>
<div class="bg-black text-white py-2 px-4 flex items-center gap-3 sticky top-0 z-50"><img src="logo.png" class="h-10 w-10 rounded-full bg-white border-2 border-yellow-400 p-1"><div><div class="font-black">XINTIMANI <span class="text-yellow-500">GROUP</span> • HOD</div><div class="text-[11px] text-gray-300" id="topStatus">Loading...</div></div><div class="ml-auto flex gap-2"><a href="index.html" class="bg-yellow-500 text-black px-3 py-1 rounded font-bold text-xs">🏠 Home</a><button id="logoutBtn" class="bg-red-600 text-white px-3 py-1 rounded font-bold text-xs">Logout</button></div></div>
<div class="max-w-6xl mx-auto p-4">
<div class="bg-white rounded-2xl p-4 border-4 border-blue-500"><h1 class="font-black text-2xl">👥 HOD Dashboard</h1><p class="text-xs text-gray-500" id="schoolLine"></p><div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-3 text-center"></div></div>
<div class="grid md:grid-cols-3 gap-2 mt-4"><a href="teacher-dashboard.html" class="bg-green-600 text-white p-4 rounded-2xl font-black text-center">👨‍🏫 Teacher View →</a><a href="issue.html" class="bg-orange-500 text-white p-4 rounded-2xl font-black text-center">📥 Issue / Retrieval →</a><button onclick="printReport()" class="bg-yellow-500 text-black p-4 rounded-2xl font-black">🖨️ Print HOD Report</button></div>
<div class="bg-white rounded-2xl p-4 mt-4"><h2 class="font-black">📚 My Subjects — Retrieval</h2><div id="subjectBox" class="mt-2 text-sm"></div></div>
<div class="bg-white rounded-2xl p-4 mt-4"><h2 class="font-black">👥 Teachers in My School</h2><div id="userList" class="mt-2 text-sm"></div></div>
</div>
<script>(function(){ try{ let s=JSON.parse(localStorage.getItem('makhanani_session')||'null'); if(s && s.isImpersonating){ document.getElementById('impBanner').style.display='block'; document.getElementById('impName').textContent=s.name+' ('+s.role+') • '+s.school; } }catch(e){} window.returnToSuperAdmin=function(){ let sup=localStorage.getItem('makhanani_superadmin_session'); if(sup){ localStorage.setItem('makhanani_session',sup); localStorage.removeItem('makhanani_superadmin_session'); localStorage.removeItem('makhanani_impersonating'); location.href='superadmin-dashboard.html'; } else { localStorage.removeItem('makhanani_session'); location.href='superadmin-login.html'; } }; })();</script>
<script type="module">
import { initializeApp } from 'firebase/app'; import { getAuth, signOut } from 'firebase/auth'; import { getFirestore, collection, getDocs, query, where } from 'firebase/firestore';
const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);
let sess=null; try{ sess=JSON.parse(localStorage.getItem('makhanani_session')||'null'); }catch(e){}
if(!sess){ location.href='login.html'; }
document.getElementById('topStatus').textContent=sess.name+' • '+sess.school+' • EMIS '+sess.emis+' • Subjects: '+(sess.subjects||[]).join(', ');
document.getElementById('schoolLine').textContent=sess.school+' • EMIS '+sess.emis+' • '+sess.prefix;
function localData(emis){ try{ let issues=JSON.parse(localStorage.getItem('EMIS_'+emis+'_makhanani_issues')||'[]'); let issued=issues.filter(i=>i.action==='Issued').length; let returned=issues.filter(i=>i.action==='Returned'||i.action==='Retrieved').length; let out=Math.max(0,issued-returned); let pct=issued===0?null:(returned/issued*100); let learners=JSON.parse(localStorage.getItem('EMIS_'+emis+'_makhanani_learners')||'[]'); let books=JSON.parse(localStorage.getItem('EMIS_'+emis+'_makhanani_ltsm')||'[]'); let copies=books.reduce((a,b)=>a+(b.copies||[]).length,0); return {issued,returned,out,pct,learners:learners.length,books:copies,issues,booksList:books}; }catch(e){ return {issued:0,returned:0,out:0,pct:null,learners:0,books:0,issues:[],booksList:[]}; } }
async function load(){
  let d=localData(sess.emis);
  document.getElementById('stats').innerHTML='<div class="bg-blue-50 rounded p-2"><div class="font-black text-xl">'+d.books+'</div><div class="text-xs">Book Copies</div></div><div class="bg-green-50 rounded p-2"><div class="font-black text-xl">'+d.learners+'</div><div class="text-xs">Learners</div></div><div class="bg-yellow-50 rounded p-2"><div class="font-black text-xl">'+d.issued+'</div><div class="text-xs">Issued</div></div><div class="bg-purple-50 rounded p-2"><div class="font-black text-xl">'+(d.pct===null?'—':d.pct.toFixed(1)+'%')+'</div><div class="text-xs">Retrieval</div></div>';
  let mySubjects=sess.subjects||['General'];
  let html=mySubjects.map(sub=>{
    let booksForSub=d.booksList.filter(b=>(b.subject||'').toLowerCase().includes(sub.toLowerCase())||sub==='General');
    let copies=booksForSub.reduce((a,b)=>a+(b.copies||[]).length,0);
    return '<div class="border rounded p-2 mb-1"><b>'+sub+'</b> • Books: '+copies+' • School Retrieval: '+(d.pct===null?'—':d.pct.toFixed(1)+'%')+' • Due: 30 November</div>';
  }).join('');
  document.getElementById('subjectBox').innerHTML=html||'No subjects';
  try{ let snap=await getDocs(query(collection(db,'users'), where('emis','==',String(sess.emis)))); let users=snap.docs.map(x=>x.data()).filter(u=>u.role==='TEACHER'||u.role==='HOD'); document.getElementById('userList').innerHTML=users.map(u=>'<div class="border rounded p-2 mb-1"><b>'+u.name+'</b> • '+u.role+' • '+u.email+' • Subjects: '+(u.subjects||[]).join(', ')+' • Classes: '+(u.classes||[]).join(', ')+'</div>').join('')||'<p class="text-gray-500">No teachers yet.</p>'; }catch(e){ document.getElementById('userList').innerHTML='⚠️ '+e.message; }
}
window.printReport=function(){ let d=localData(sess.emis); document.getElementById('printArea').innerHTML='<h1>XINTIMANI GROUP • HOD REPORT</h1><p>HOD: '+sess.name+' • School: '+sess.school+' • EMIS '+sess.emis+' • Subjects: '+(sess.subjects||[]).join(', ')+' • Date: '+new Date().toLocaleString()+'</p><table><tr><th>Books</th><th>Learners</th><th>Issued</th><th>Returned</th><th>Retrieval %</th></tr><tr><td>'+d.books+'</td><td>'+d.learners+'</td><td>'+d.issued+'</td><td>'+d.returned+'</td><td>'+(d.pct===null?'—':d.pct.toFixed(1)+'%')+'</td></tr></table><p>Due 30 November</p>'; setTimeout(()=>window.print(),100); };
document.getElementById('logoutBtn').addEventListener('click', async()=>{ if(sess && sess.isImpersonating){ window.returnToSuperAdmin(); return; } await signOut(auth); localStorage.removeItem('makhanani_session'); location.href='login.html'; });
load();
</script></body></html>
