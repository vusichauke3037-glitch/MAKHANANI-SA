<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Staff — Makhanani LTSM</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-200 min-h-screen"><script>(function(){ let e=localStorage.getItem('makhanani_active_emis'); if(!e){ location.href='school.html'; return; } window.EMIS=e; window.SCHOOL_NAME=localStorage.getItem('makhanani_active_school')||e; window.PREFIX=e==='700310854'?'WHS':e==='911360870'?'GSH':localStorage.getItem('makhanani_active_school_short')||'WHS'; window.SKEY=function(k){ return 'EMIS_'+e+'_'+k; }; window.PKEY=function(k){ return 'makhanani_'+window.PREFIX+'_'+k; }; window.SGET=function(k,f){ try{ let a=JSON.parse(localStorage.getItem(SKEY(k))||'[]'); let b=JSON.parse(localStorage.getItem(PKEY(k))||'[]'); return a.length>=b.length?a:(b.length?b:(f||[])); }catch(err){ return f||[]; } }; window.SSET=function(k,v){ localStorage.setItem(SKEY(k),JSON.stringify(v)); localStorage.setItem(PKEY(k),JSON.stringify(v)); if(window.PREFIX==='WHS') localStorage.setItem('makhanani_'+k,JSON.stringify(v)); if(k==='makhanani_issues'){ localStorage.setItem(SKEY('makhanani_history'),JSON.stringify(v)); } }; })();</script>
<script>
// ✅ HOD <-> STAFF SYNC (same as index.html)
(function(){ let emis=window.EMIS, prefix=window.PREFIX; let schools=JSON.parse(localStorage.getItem('makhanani_schools')||'[]'); let school=schools.find(s=>s.prefix===prefix||s.emis===emis); let subHods=school&&school.depts?school.depts.filter(d=>d.hod&&d.hod.trim()!==''):[]; let get=(k)=>{ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){ return []; } }; let allStaff=[...get('EMIS_'+emis+'_makhanani_staff'),...get('makhanani_'+prefix+'_makhanani_staff')]; let allHods=[...get('EMIS_'+emis+'_makhanani_hods'),...get('makhanani_'+prefix+'_makhanani_hods')]; let staffNames=new Set(allStaff.map(s=>s.name.toLowerCase())); let hodNames=new Set(allHods.map(h=>h.name.toLowerCase())); let chS=false,chH=false,chSch=false; subHods.forEach(d=>{ let n=d.hod.trim(); if(!staffNames.has(n.toLowerCase())){ allStaff.push({name:n,role:'HOD',dept:d.dept,subj:'',phone:'',user:n.toLowerCase().replace(/[^a-z]/g,'')+'_hod',pass:d.pw||'Hod2026'}); staffNames.add(n.toLowerCase()); chS=true; } if(!hodNames.has(n.toLowerCase())){ allHods.push({name:n,dept:d.dept,phone:'',user:n.toLowerCase().replace(/[^a-z]/g,'')+'_hod',pass:d.pw||'Hod2026'}); hodNames.add(n.toLowerCase()); chH=true; } }); allStaff.filter(s=>s.role==='HOD').forEach(h=>{ if(!school) return; if(!school.depts) school.depts=[]; let e2=school.depts.find(d=>d.dept===h.dept); if(!e2){ school.depts.push({dept:h.dept,hod:h.name,pw:h.pass||'Hod2026'}); chSch=true; } else if(!e2.hod){ e2.hod=h.name; e2.pw=h.pass||'Hod2026'; chSch=true; } }); if(chS){ localStorage.setItem('EMIS_'+emis+'_makhanani_staff',JSON.stringify(allStaff)); localStorage.setItem('makhanani_'+prefix+'_makhanani_staff',JSON.stringify(allStaff)); } if(chH){ let u=[]; let s2=new Set(); allHods.forEach(h=>{ if(!s2.has(h.name.toLowerCase())){ s2.add(h.name.toLowerCase()); u.push(h); } }); localStorage.setItem('EMIS_'+emis+'_makhanani_hods',JSON.stringify(u)); localStorage.setItem('makhanani_'+prefix+'_makhanani_hods',JSON.stringify(u)); } if(chSch) localStorage.setItem('makhanani_schools',JSON.stringify(schools)); })();
function syncHodToSubscription(name,dept,pass){ let schools=JSON.parse(localStorage.getItem('makhanani_schools')||'[]'); let school=schools.find(s=>s.prefix===window.PREFIX||s.emis===window.EMIS); if(!school) return; if(!school.depts) school.depts=[]; let e=school.depts.find(d=>d.dept===dept); if(!e) school.depts.push({dept:dept,hod:name,pw:pass||'Hod2026'}); else if(!e.hod) { e.hod=name; e.pw=pass||'Hod2026'; } localStorage.setItem('makhanani_schools',JSON.stringify(schools)); }
</script>
<div class="max-w-6xl mx-auto p-3 flex flex-wrap gap-2"><span class="font-black text-lg">👥 ALL STAFF — Synced With Subscription HODs</span><span id="schoolBadge" class="bg-blue-950 text-white px-3 py-1 rounded-full text-xs font-bold"></span><a href="dashboard.html" class="bg-gray-800 text-white px-3 py-2 rounded-lg font-bold text-sm">← Dashboard</a><a href="hod.html" class="bg-orange-500 text-white px-3 py-2 rounded-lg font-bold text-sm">👑 HOD Page →</a><a href="index.html" class="bg-black text-white px-3 py-2 rounded-lg font-bold text-sm">🏠 Subscription (Super Admin) →</a></div>
<div class="max-w-6xl mx-auto px-3 pb-6"><div class="bg-white rounded-xl shadow p-4"><div class="font-bold">➕ Add Staff Member — HODs auto-sync to Subscription</div><div class="flex gap-2 mt-2 flex-wrap" id="roleTabs"><button class="px-3 py-1 rounded-full font-bold bg-blue-950 text-white text-sm" onclick="setRole('Teacher',this)">👩🏽‍🏫 Teacher</button><button class="px-3 py-1 rounded-full font-bold bg-gray-100 text-sm" onclick="setRole('HOD',this)">👑 HOD</button><button class="px-3 py-1 rounded-full font-bold bg-gray-100 text-sm" onclick="setRole('Librarian',this)">📚 Librarian</button><button class="px-3 py-1 rounded-full font-bold bg-gray-100 text-sm" onclick="setRole('School Admin',this)">🛠️ School Admin</button></div><div class="grid grid-cols-2 gap-2 mt-2"><input id="sName" placeholder="Full Name *" class="border rounded-lg px-3 py-2"><select id="sDept" class="border rounded-lg px-3 py-2"><option>Commerce</option><option>Languages</option><option>Mathematics</option><option>Sciences</option><option>Humanities</option><option>Technology</option><option>Whole School</option></select><input id="sSubject" placeholder="Subject" class="border rounded-lg px-3 py-2"><input id="sPhone" placeholder="Phone" class="border rounded-lg px-3 py-2"><input id="sUser" placeholder="Username" class="border rounded-lg px-3 py-2"><input id="sPass" placeholder="Password e.g. 1234" class="border rounded-lg px-3 py-2"></div><button onclick="addStaff()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold mt-2">✅ Save Staff</button><p id="msg" class="text-green-600 font-bold text-sm mt-1"></p><div class="flex gap-2 mt-2 text-center"><div class="border rounded p-2">Teachers<br><b id="cTeacher">0</b></div><div class="border rounded p-2">HODs<br><b id="cHod">0</b></div><div class="border rounded p-2">Librarians<br><b id="cLib">0</b></div><div class="border rounded p-2">Total<br><b id="cTotal">0</b></div></div></div>
<div class="bg-white rounded-xl shadow p-4 mt-3"><div class="font-bold">📋 Staff List — EMIS: <span id="emisShow"></span> • Includes Subscription HODs</div><div class="flex gap-2 mt-2 flex-wrap"><button class="px-3 py-1 rounded-full bg-blue-950 text-white text-sm font-bold" onclick="setFilter('All',this)">All</button><button class="px-3 py-1 rounded-full bg-gray-100 text-sm font-bold" onclick="setFilter('Teacher',this)">Teachers</button><button class="px-3 py-1 rounded-full bg-gray-100 text-sm font-bold" onclick="setFilter('HOD',this)">HODs</button><button class="px-3 py-1 rounded-full bg-gray-100 text-sm font-bold" onclick="setFilter('Librarian',this)">Librarians</button></div><input id="search" oninput="render()" placeholder="🔍 Search..." class="border rounded-lg px-3 py-2 w-full mt-2"><div id="list" class="mt-2 text-sm"></div></div></div>
<script>
document.getElementById('schoolBadge').textContent='🏫 '+(window.SCHOOL_NAME||'')+' • EMIS: '+(window.EMIS||''); document.getElementById('emisShow').textContent=window.EMIS||'';
let currentRole='Teacher', currentFilter='All';
let staff=SGET('makhanani_staff',[]); if(staff.length==0){ let ot=SGET('makhanani_teachers',[]); let oh=SGET('makhanani_hods',[]); ot.forEach(t=>staff.push({name:t.name,role:'Teacher',dept:t.dept,subj:t.subj||'',phone:t.phone||'',user:t.user,pass:t.pass})); oh.forEach(t=>staff.push({name:t.name,role:'HOD',dept:t.dept,subj:'',phone:t.phone||'',user:t.user,pass:t.pass})); if(staff.length>0) SSET('makhanani_staff',staff); }
function setRole(r,b){ currentRole=r; document.querySelectorAll('#roleTabs button').forEach(x=>{ x.className='px-3 py-1 rounded-full font-bold bg-gray-100 text-sm'; }); b.className='px-3 py-1 rounded-full font-bold bg-blue-950 text-white text-sm'; }
function setFilter(f,b){ currentFilter=f; render(); }
function addStaff(){ let name=document.getElementById('sName').value.trim(); let dept=document.getElementById('sDept').value; let subj=document.getElementById('sSubject').value.trim(); let phone=document.getElementById('sPhone').value.trim(); let user=document.getElementById('sUser').value.trim(); let pass=document.getElementById('sPass').value.trim(); if(!name){ alert('Enter name'); return; } if(!user) user=name.toLowerCase().replace(/[^a-z]/g,'')+(currentRole=='HOD'?'_hod':''); if(!pass) pass='1234'; staff.push({name,role:currentRole,dept,subj,phone,user,pass}); SSET('makhanani_staff',staff); if(currentRole=='Teacher'){ let t=SGET('makhanani_teachers',[]); t.push({name,dept,subj,phone,user,pass}); SSET('makhanani_teachers',t); } if(currentRole=='HOD'){ let h=SGET('makhanani_hods',[]); h.push({name,dept,phone,user,pass}); SSET('makhanani_hods',h); syncHodToSubscription(name,dept,pass); } document.getElementById('msg').textContent='✅ '+name+' added as '+currentRole+' — Login: '+user+' / '+pass+(currentRole=='HOD' ? ' • Also synced to Subscription (Super Admin)' : ''); document.getElementById('sName').value=''; render(); }
function del(i){ if(confirm('Delete? This deletes from Staff + HOD list. Subscription HOD remains — remove there too if needed.')){ staff.splice(i,1); SSET('makhanani_staff',staff); render(); } }
function render(){ let q=(document.getElementById('search').value||'').toLowerCase(); let f=staff.filter(s=>(currentFilter=='All'||s.role==currentFilter)&&(s.name+' '+s.dept+' '+(s.subj||'')).toLowerCase().includes(q)); document.getElementById('cTeacher').textContent=staff.filter(s=>s.role=='Teacher').length; document.getElementById('cHod').textContent=staff.filter(s=>s.role=='HOD').length; document.getElementById('cLib').textContent=staff.filter(s=>s.role=='Librarian').length; document.getElementById('cTotal').textContent=staff.length; document.getElementById('list').innerHTML=f.length==0?'<p class="text-gray-500">No staff yet.</p>':f.map(s=>{ let idx=staff.indexOf(s); return '<div class="bg-gray-50 rounded p-2 mt-1 flex justify-between"><span><b>'+s.name+'</b> — '+s.role+' — '+s.dept+' — '+(s.subj||'-')+' — '+s.user+' / '+s.pass+(s.role==='HOD'?' • <span class="text-orange-600 font-bold">Synced to Subscription</span>':'')+'</span><button onclick="del('+idx+')" class="bg-red-600 text-white px-2 py-1 rounded text-xs">Delete</button></div>'; }).join(''); }
render();
</script></body></html>
