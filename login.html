<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login — Firebase — Makhanani LTSM</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
<div class="max-w-md w-full bg-white rounded-2xl p-6 shadow">
<div class="text-center"><img src="logo.png" class="h-16 w-16 mx-auto rounded-xl border-2 border-yellow-400 p-1" alt="Makhanani LTSM Logo"><h1 class="font-black text-2xl mt-2">Makhanani LTSM</h1><p class="text-xs text-gray-500">Xintimani Group • Firebase Login • makhanani-ltsm</p></div>
<div class="mt-4"><label class="font-bold text-sm">🏫 School</label><select id="schoolSel" class="border-2 rounded-lg px-3 py-3 w-full font-bold mt-1"><option value="WHS|700310854|Wordsworth High School">Wordsworth High School</option><option value="GSH|911360870|George Sonto High School">George Sonto High School</option></select></div>
<div class="mt-3"><label class="font-bold text-sm">📧 Email</label><input id="email" type="email" placeholder="e.g. dube@wordsworth.co.za" class="border-2 rounded-lg px-3 py-3 w-full mt-1"></div>
<div class="mt-3"><label class="font-bold text-sm">🔒 Password</label><input id="password" type="password" placeholder="Your password" class="border-2 rounded-lg px-3 py-3 w-full mt-1"></div>
<button id="loginBtn" type="button" class="bg-black text-white w-full py-3 rounded-xl font-black mt-4">Login with Firebase →</button>
<button id="forgotBtn" type="button" class="bg-gray-200 text-black w-full py-2 rounded-xl font-bold mt-2 text-sm">Forgot Password? Send Reset Email</button>
<p id="loginMsg" class="text-sm font-bold mt-2 text-center"></p>
<div class="bg-green-50 border-2 border-green-500 rounded-xl p-3 mt-4 text-xs"><b>✅ Firebase Connected: makhanani-ltsm</b><br><b>Super Admin:</b> superadmin@makhanani.co.za / SuperAdmin2026 • <b>Admin:</b> admin@makhanani.co.za / Admin2026</div>
<div class="text-center mt-3"><a href="index.html" class="text-blue-600 underline text-sm">← Back to Home</a></div>
</div>
<script type="module">
import { auth, db } from './firebase-config.js';
import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
async function doLogin(){
  let v=document.getElementById('schoolSel').value.split('|'); let prefix=v[0], emis=v[1], name=v[2];
  let email=document.getElementById('email').value.trim().toLowerCase(); let pass=document.getElementById('password').value.trim();
  if(!email||!pass){ document.getElementById('loginMsg').innerHTML='❌ Enter Email + Password'; return; }
  document.getElementById('loginMsg').innerHTML='⏳ Logging in to makhanani-ltsm...';
  try{
    let cred=await signInWithEmailAndPassword(auth, email, pass); let uid=cred.user.uid;
    let snap=await getDoc(doc(db, 'users', uid)); let profile = snap.exists() ? snap.data() : {name: email, email: email, role: 'TEACHER', subject:'General', class:'', grades:'', school: name};
    let subs = Array.isArray(profile.subjects) && profile.subjects.length ? profile.subjects : [profile.subject||'General'];
    let cls = Array.isArray(profile.classes) && profile.classes.length ? profile.classes : (profile.class ? [profile.class] : []);
    let session={uid:uid, name:profile.name||email, email:email, role:profile.role||'TEACHER', subjects:subs, subject:subs[0], classes:cls.map(c=>String(c).toUpperCase()), class:cls[0]||'', grades:profile.grades||'', school:profile.school||name, emis:profile.emis||emis, prefix:profile.prefix||prefix, loginAt:new Date().toISOString()};
    localStorage.setItem('makhanani_session', JSON.stringify(session)); localStorage.setItem('makhanani_active_emis', session.emis); localStorage.setItem('makhanani_active_school', session.school);
    document.getElementById('loginMsg').innerHTML='✅ Welcome, <b>'+session.name+'</b> — '+session.role+' — Redirecting...';
    setTimeout(()=>{ if(session.role==='SUPER_ADMIN') window.location.href='super-admin-dashboard.html'; else if(session.role==='TEACHER') window.location.href='teacher-dashboard.html'; else if(session.role==='HOD') window.location.href='hod-dashboard.html'; else if(session.role==='LIBRARIAN') window.location.href='dashboard.html'; else if(session.role==='ADMIN') window.location.href='admin-dashboard.html'; else window.location.href='dashboard.html'; }, 600);
  }catch(e){ let msg=e.code||e.message; if(msg.includes('user-not-found')||msg.includes('invalid-credential')) msg='❌ Wrong Email or Password.'; else if(msg.includes('too-many-requests')) msg='❌ Too many tries. Wait 1 minute.'; else msg='❌ '+msg; document.getElementById('loginMsg').innerHTML=msg; }
}
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('password').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('forgotBtn').addEventListener('click', async ()=>{ let email=document.getElementById('email').value.trim().toLowerCase(); if(!email){ alert('Enter your Email first.'); return; } try{ await sendPasswordResetEmail(auth, email); document.getElementById('loginMsg').innerHTML='✅ Reset email sent to <b>'+email+'</b>'; }catch(e){ document.getElementById('loginMsg').innerHTML='❌ '+e.message; } });
</script>
</body></html>
