<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add Teachers — Makhanani LTSM</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-200 min-h-screen"><script>(function(){ let e=localStorage.getItem('makhanani_active_emis'); if(!e){ location.href='school.html'; return; } window.EMIS=e; window.SCHOOL_NAME=localStorage.getItem('makhanani_active_school')||e; window.SKEY=function(k){ return 'EMIS_'+e+'_'+k; }; window.SGET=function(k,f){ try{ return JSON.parse(localStorage.getItem(SKEY(k))||JSON.stringify(f||[])); }catch(err){ return f||[]; } }; window.SSET=function(k,v){ localStorage.setItem(SKEY(k),JSON.stringify(v)); }; })();</script>
<div class="max-w-4xl mx-auto p-3 flex gap-2 flex-wrap"><span class="font-black">👩🏽‍🏫 ADD TEACHERS</span><span class="bg-blue-950 text-white px-2 py-1 rounded-full text-xs font-bold" id="badge"></span><a href="dashboard.html" class="bg-gray-800 text-white px-3 py-1 rounded font-bold text-sm">← Dashboard</a><a href="staff.html" class="bg-violet-700 text-white px-3 py-1 rounded font-bold text-sm">👥 All Staff</a></div>
<div class="max-w-4xl mx-auto px-3 pb-6"><div class="bg-white rounded-xl shadow p-4"><div class="grid grid-cols-2 gap-2"><input id="tName" placeholder="Full Name *" class="border rounded-lg px-3 py-2"><select id="tDept" class="border rounded-lg px-3 py-2"><option>Commerce</option><option>Languages</option><option>Mathematics</option><option>Sciences</option><option>Humanities</option><option>Technology</option></select><input id="tSubject" placeholder="Subject" class="border rounded-lg px-3 py-2"><input id="tPhone" placeholder="Phone" class="border rounded-lg px-3 py-2"><input id="tUser" placeholder="Username" class="border rounded-lg px-3 py-2"><input id="tPass" placeholder="Password" class="border rounded-lg px-3 py-2"></div><button onclick="addTeacher()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold mt-2">✅ Save Teacher</button><p id="msg" class="text-green-600 font-bold text-sm mt-1"></p></div><div class="bg-white rounded-xl shadow p-4 mt-3"><input id="search" oninput="render()" placeholder="🔍 Search..." class="border rounded-lg px-3 py-2 w-full"><div id="list" class="mt-2 text-sm"></div></div></div>
<script>
document.getElementById('badge').textContent='🏫 '+window.SCHOOL_NAME+' • EMIS: '+window.EMIS;
let teachers=SGET('makhanani_teachers',[]); let staff=SGET('makhanani_staff',[]);
function addTeacher(){ let name=document.getElementById('tName').value.trim(); let dept=document.getElementById('tDept').value; let subj=document.getElementById('tSubject').value.trim(); let phone=document.getElementById('tPhone').value.trim(); let user=document.getElementById('tUser').value.trim()||name.toLowerCase().replace(/[^a-z]/g,''); let pass=document.getElementById('tPass').value.trim()||'1234'; if(!name){ alert('Enter name'); return; } teachers.push({name,dept,subj,phone,user,pass}); SSET('makhanani_teachers',teachers); staff.push({name,role:'Teacher',dept,subj,phone,user,pass}); SSET('makhanani_staff',staff); document.getElementById('msg').textContent='✅ '+name+' added! Login: '+user+' / '+pass; render(); }
function del(i){ if(confirm('Delete?')){ let t=teachers[i]; teachers.splice(i,1); SSET('makhanani_teachers',teachers); staff=staff.filter(s=>!(s.name==t.name&&s.role=='Teacher')); SSET('makhanani_staff',staff); render(); } }
function render(){ let q=(document.getElementById('search').value||'').toLowerCase(); let f=teachers.filter(t=>(t.name+' '+t.dept).toLowerCase().includes(q)); document.getElementById('list').innerHTML=f.length==0?'<p class="text-gray-500">No teachers yet.</p>':f.map(t=>{ let idx=teachers.indexOf(t); return '<div class="bg-gray-50 rounded p-2 mt-1 flex justify-between"><span><b>'+t.name+'</b> — '+t.dept+' — '+(t.subj||'-')+' — '+t.user+' / '+t.pass+'</span><button onclick="del('+idx+')" class="bg-red-600 text-white px-2 py-1 rounded text-xs">Delete</button></div>'; }).join(''); }
render();
</script></body></html>
