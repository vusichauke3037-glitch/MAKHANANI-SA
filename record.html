<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Record - One Class Per Page - Wordsworth</title><script src="https://cdn.tailwindcss.com"></script>
<style>@media print{body *{visibility:hidden}#pages,#pages *{visibility:visible}#pages{position:absolute;left:0;top:0;width:100%;margin:0!important}.no-print{display:none!important}.class-page{box-shadow:none!important;margin:0!important;page-break-after:always!important;break-after:page!important}.class-page:last-child{page-break-after:auto!important;break-after:auto!important}}@page{size:A4;margin:10mm}.class-page{page-break-after:always;break-after:page}</style></head>
<body class="bg-gray-200 min-h-screen">
<div id="pwGuard" class="fixed inset-0 bg-gray-800 flex items-center justify-center p-4 z-[100]"><div class="bg-white rounded-3xl w-full max-w-sm p-6 text-center"><div class="text-4xl">📄</div><h2 class="font-bold text-xl mt-2">Issue / Retrieval Record</h2><p class="text-sm text-gray-500">Select role + enter password.</p><select id="pwRole" class="w-full border-2 rounded-lg px-3 py-3 font-bold mt-3"><option value="librarian">📚 Librarian</option><option value="teacher">👩‍🏫 Teacher</option><option value="hod">🧑‍🏫 HOD</option><option value="principal">👑 Principal</option></select><div class="relative mt-3"><input id="pwInput" type="password" placeholder="Enter password" class="w-full border-2 rounded-lg px-3 py-3 text-center font-bold" onkeydown="if(event.key==='Enter') checkPagePw()"><button onclick="let i=document.getElementById('pwInput');i.type=i.type==='password'?'text':'password'" class="absolute right-2 top-2.5 text-xs bg-gray-100 px-2 py-1 rounded">👁 Show</button></div><div id="pwError" class="text-red-600 text-sm font-bold mt-2 hidden">❌ Wrong password for that role.</div><button onclick="checkPagePw()" class="w-full bg-gray-800 text-white py-3 rounded-lg font-bold mt-4">Unlock Record →</button><a href="dashboard.html" class="block text-xs underline mt-2">← Back to Dashboard</a></div></div>
<script>(function(){let passwords=JSON.parse(localStorage.getItem('makhanani_passwords')||'{"librarian":"Librarian2026","hod":"Hod2026","teacher":"Teacher2026","principal":"Principal2026","master":"Master2026"}');localStorage.setItem('makhanani_passwords',JSON.stringify(passwords));window.checkPagePw=function(){let role=document.getElementById('pwRole').value;let v=document.getElementById('pwInput').value;if(v===passwords[role]||v===passwords.master){sessionStorage.setItem('makhanani_unlocked_'+role,'yes');localStorage.setItem('makhanani_dashboard_role',role);document.getElementById('pwGuard').remove();}else{document.getElementById('pwError').classList.remove('hidden');document.getElementById('pwInput').value='';}};setTimeout(()=>document.getElementById('pwInput').focus(),200);})();</script>
<div class="no-print max-w-4xl mx-auto p-4 flex flex-wrap gap-2 items-center sticky top-0 bg-gray-200 z-10">
<a href="dashboard.html" class="bg-blue-950 text-white px-4 py-2 rounded-lg font-bold">← Dashboard</a><a href="librarian.html" class="bg-white px-4 py-2 rounded-lg font-bold">Librarian</a>
<select id="filterClass" onchange="render()" class="border rounded-lg px-3 py-2"><option value="">All Classes — One Page Each</option></select>
<select id="filterTeacher" onchange="render()" class="border rounded-lg px-3 py-2"><option value="">All Teachers</option></select>
<select id="filterType" onchange="render()" class="border rounded-lg px-3 py-2"><option value="all">Issue + Retrieval</option><option value="issued">Issued Only</option><option value="returned">Returned Only</option></select>
<button onclick="window.print()" class="bg-green-600 text-white px-5 py-2 rounded-lg font-bold">🖨️ Print A4 — One Class Per Page</button>
<button onclick="logoutAll()" class="bg-red-600 text-white px-4 py-2 rounded-lg font-bold">🔒 Logout</button>
<span id="pageInfo" class="text-sm text-gray-600"></span>
</div>
<div id="pages" class="max-w-4xl mx-auto pb-8"></div>
<script>
let issues=JSON.parse(localStorage.getItem('makhanani_issues')||'[]');let ltsm=JSON.parse(localStorage.getItem('makhanani_ltsm')||'[]');
function getTitle(no){for(let it of ltsm){if(it.copies.some(c=>c.bookNo===no))return it;}return null;}
function logoutAll(){if(!confirm('Logout?'))return;sessionStorage.clear();location.href='dashboard.html';}
function render(){let classes=[...new Set(issues.map(x=>x.class||x.grade||'No Class'))].sort();let selC=document.getElementById('filterClass');let curC=selC.value;selC.innerHTML='<option value="">All Classes — One Page Each</option>'+classes.map(c=>`<option>${c}</option>`).join('');selC.value=curC;let teachers=[...new Set(issues.map(x=>x.teacher||'-'))].sort();let selT=document.getElementById('filterTeacher');let curT=selT.value;selT.innerHTML='<option value="">All Teachers</option>'+teachers.map(t=>`<option>${t}</option>`).join('');selT.value=curT;let fC=selC.value,fT=document.getElementById('filterTeacher').value,fType=document.getElementById('filterType').value;let filtered=issues.filter(x=>(!fC||(x.class||x.grade)===fC)&&(!fT||x.teacher===fT));let byClass={};filtered.forEach(x=>{let cl=x.class||x.grade||'No Class';if(!byClass[cl])byClass[cl]=[];byClass[cl].push(x);});let classNames=Object.keys(byClass).sort();document.getElementById('pageInfo').textContent=classNames.length?`${classNames.length} class page(s) • ${filtered.length} records`:'No records';if(!classNames.length){document.getElementById('pages').innerHTML=`<div class="bg-white p-12 text-center rounded-2xl shadow">No records yet.<br><span class="text-sm text-gray-400">Issue a book first, then come back.</span></div>`;return;}document.getElementById('pages').innerHTML=classNames.map((cl,pageIdx)=>{let list=[...byClass[cl]].sort((a,b)=>(a.learner||'').localeCompare(b.learner||''));let total=list.length;let returned=list.filter(x=>x.returned).length;let still=total-returned;let pct=total?Math.round(returned/total*100):0;let teacher=list[0]?.teacher||'-';let dept=list[0]?.dept||'-';let showIssued=fType!=='returned',showReturned=fType!=='issued';return `<div class="class-page bg-white p-7 shadow my-4"><div class="text-center border-b-4 border-blue-950 pb-2"><div class="font-black text-2xl">WORDSWORTH HIGH SCHOOL</div><div class="text-sm font-bold tracking-widest">MAKHANANI — LTSM • ISSUING / RETRIEVAL RECORD</div><div class="text-xs text-gray-500">One Class Per Page • Learner Signs On Issue & On Return</div></div><div class="flex justify-between text-xs mt-2"><span>Page ${pageIdx+1} of ${classNames.length}</span><span>Class: <b>${cl}</b></span></div><div class="grid grid-cols-3 gap-2 text-sm mt-3 border rounded-lg p-3 bg-gray-50"><div><b>Class:</b> ${cl}</div><div><b>Teacher:</b> ${teacher}</div><div><b>Department:</b> ${dept}</div><div><b>Date:</b> ${new Date().toLocaleDateString()}</div><div><b>Term:</b> Term ____ / 2026</div><div><b>Learners:</b> ${[...new Set(list.map(x=>x.learner))].length}</div></div><div class="mt-4"><div class="font-bold bg-blue-950 text-white px-3 py-1.5 text-sm">1. BOOKS ISSUED — CLASS: ${cl} (${list.length})</div><table class="w-full text-[13px] border-collapse"><thead><tr class="bg-gray-100"><th class="border p-1.5 text-left w-8">No</th><th class="border p-1.5 text-left">WHS No</th><th class="border p-1.5 text-left">Title / Subject</th><th class="border p-1.5 text-left">Learner</th><th class="border p-1.5 text-left">Learner ID</th><th class="border p-1.5 text-left">Date Issued</th><th class="border p-1.5 text-left">Signature (Issue)</th></tr></thead><tbody>${showIssued?list.map((x,i)=>{let it=getTitle(x.bookNo);return `<tr><td class="border p-1.5">${i+1}</td><td class="border p-1.5 font-bold">${x.bookNo}</td><td class="border p-1.5">${x.title}<br><span class="text-[11px] text-gray-400">${it?it.subject:''}</span></td><td class="border p-1.5">${x.learner}</td><td class="border p-1.5">${x.learnerId||'-'}</td><td class="border p-1.5">${x.date||'-'}</td><td class="border p-1.5 h-7"></td></tr>`}).join(''):`<tr><td colspan="7" class="border p-2 text-center">— Hidden —</td></tr>`}</tbody></table></div><div class="mt-4"><div class="font-bold bg-green-700 text-white px-3 py-1.5 text-sm">2. BOOKS RETRIEVED — CLASS: ${cl}</div><table class="w-full text-[13px] border-collapse"><thead><tr class="bg-gray-100"><th class="border p-1.5 text-left w-8">No</th><th class="border p-1.5 text-left">WHS No</th><th class="border p-1.5 text-left">Title</th><th class="border p-1.5 text-left">Learner</th><th class="border p-1.5 text-left">Date Returned</th><th class="border p-1.5 text-left">Condition</th><th class="border p-1.5 text-left">Signature (Return)</th></tr></thead><tbody>${showReturned?(list.filter(x=>x.returned).map((x,i)=>`<tr><td class="border p-1.5">${i+1}</td><td class="border p-1.5 font-bold">${x.bookNo}</td><td class="border p-1.5">${x.title}</td><td class="border p-1.5">${x.learner}</td><td class="border p-1.5">${x.date||'-'}</td><td class="border p-1.5 text-[11px]">☐ Good &nbsp; ☐ Damaged &nbsp; ☐ Lost</td><td class="border p-1.5 h-7"></td></tr>`).join('')||`<tr><td colspan="7" class="border p-3 text-center text-gray-400">No returns yet — 0%</td></tr>`):`<tr><td colspan="7" class="border p-2 text-center">— Hidden —</td></tr>`}</tbody></table></div><div class="mt-3 border border-orange-200 rounded-lg p-2 bg-orange-50 text-sm"><b>⚠️ Still Out (${still}):</b> ${still?list.filter(x=>!x.returned).map(x=>`${x.bookNo} — ${x.learner}`).join(' • '):'None — All returned ✅'}</div><div class="mt-3 border rounded-lg p-3"><div class="font-bold text-sm">3. SUMMARY — THIS CLASS ONLY</div><div class="grid grid-cols-4 gap-2 text-center mt-2 text-sm"><div class="border rounded p-2"><div class="text-[11px]">TOTAL ISSUED</div><div class="font-bold text-lg">${total}</div></div><div class="border rounded p-2"><div class="text-[11px]">RETURNED</div><div class="font-bold text-lg text-green-600">${returned}</div></div><div class="border rounded p-2"><div class="text-[11px]">STILL OUT</div><div class="font-bold text-lg text-orange-600">${still}</div></div><div class="border rounded p-2 bg-blue-50"><div class="text-[11px]">% RETRIEVAL</div><div class="font-bold text-lg">${pct}%</div><div class="text-[11px]">${pct>=80?'✅ Excellent':pct>=50?'⚠️ Follow up':'❌ Urgent'}</div></div></div><div class="text-[11px] mt-1">Formula: Returned ÷ Total × 100 • Target 95%+</div></div><div class="grid grid-cols-3 gap-6 mt-6 text-sm"><div><div class="border-t-2 border-black pt-1 mt-8">Class Rep<br><span class="text-[11px]">Name & Signature & Date</span></div></div><div><div class="border-t-2 border-black pt-1 mt-8">Teacher — ${teacher}<br><span class="text-[11px]">Name & Signature & Date</span></div></div><div><div class="border-t-2 border-black pt-1 mt-8">HOD / Librarian<br><span class="text-[11px]">Name & Signature & Date</span></div></div></div><div class="text-center text-[11px] text-gray-400 mt-4">Wordsworth • Makhanani LTSM • Class: ${cl} • Page ${pageIdx+1}/${classNames.length} • ${new Date().toLocaleString()}</div></div>`;}).join('');}
render();
let _t;function resetT(){clearTimeout(_t);_t=setTimeout(()=>{sessionStorage.clear();alert('⏰ Auto-logged out after 15 mins.');location.href='dashboard.html';},15*60*1000);}['click','keydown','touchstart'].forEach(e=>document.addEventListener(e,resetT));resetT();
</script></body></html>
