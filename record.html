<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Issue / Retrieval Record - One Class Per Page - Wordsworth</title><script src="https://cdn.tailwindcss.com"></script>
<style>
  @media print{
    body *{visibility:hidden}
    #pages, #pages *{visibility:visible}
    #pages{position:absolute;left:0;top:0;width:100%;margin:0!important}
    .no-print{display:none!important}
    .class-page{box-shadow:none!important;margin:0!important;page-break-after:always!important;break-after:page!important}
    .class-page:last-child{page-break-after:auto!important;break-after:auto!important}
  }
  @page{size:A4;margin:10mm}
  .class-page{page-break-after:always;break-after:page}
</style></head>
<body class="bg-gray-200 min-h-screen">

<!-- CONTROLS - NOT PRINTED -->
<div class="no-print max-w-4xl mx-auto p-4 flex flex-wrap gap-2 items-center sticky top-0 bg-gray-200 z-10">
  <a href="dashboard.html" class="bg-blue-950 text-white px-4 py-2 rounded-lg font-bold">← Dashboard</a>
  <a href="librarian.html" class="bg-white px-4 py-2 rounded-lg font-bold">Librarian</a>
  <select id="filterClass" onchange="render()" class="border rounded-lg px-3 py-2"><option value="">All Classes — One Page Each</option></select>
  <select id="filterTeacher" onchange="render()" class="border rounded-lg px-3 py-2"><option value="">All Teachers</option></select>
  <select id="filterType" onchange="render()" class="border rounded-lg px-3 py-2"><option value="all">Issue + Retrieval</option><option value="issued">Issued Only</option><option value="returned">Returned Only</option></select>
  <button onclick="window.print()" class="bg-green-600 text-white px-5 py-2 rounded-lg font-bold">🖨️ Print A4 — One Class Per Page</button>
  <span id="pageInfo" class="text-sm text-gray-600"></span>
</div>

<div id="pages" class="max-w-4xl mx-auto pb-8"></div>

<script>
let issues=JSON.parse(localStorage.getItem('makhanani_issues')||'[]');
let ltsm=JSON.parse(localStorage.getItem('makhanani_ltsm')||'[]');
function getTitle(no){ for(let it of ltsm){ if(it.copies.some(c=>c.bookNo===no)) return it; } return null; }

function render(){
  // Dropdowns
  let classes=[...new Set(issues.map(x=>x.class||x.grade||'No Class'))].sort();
  let selC=document.getElementById('filterClass'); let curC=selC.value;
  selC.innerHTML='<option value="">All Classes — One Page Each</option>'+classes.map(c=>`<option>${c}</option>`).join(''); selC.value=curC;
  let teachers=[...new Set(issues.map(x=>x.teacher||'-'))].sort();
  let selT=document.getElementById('filterTeacher'); let curT=selT.value;
  selT.innerHTML='<option value="">All Teachers</option>'+teachers.map(t=>`<option>${t}</option>`).join(''); selT.value=curT;

  let fC=selC.value, fT=document.getElementById('filterTeacher').value, fType=document.getElementById('filterType').value;
  let filtered=issues.filter(x=> (!fC || (x.class||x.grade)===fC) && (!fT || x.teacher===fT) );

  // Group by class - ONE PAGE PER CLASS
  let byClass={};
  filtered.forEach(x=>{ let cl=x.class||x.grade||'No Class'; if(!byClass[cl]) byClass[cl]=[]; byClass[cl].push(x); });
  let classNames=Object.keys(byClass).sort();

  document.getElementById('pageInfo').textContent = classNames.length ? `${classNames.length} class page(s) • ${filtered.length} records` : 'No records';

  if(!classNames.length){
    document.getElementById('pages').innerHTML=`<div class="bg-white p-12 text-center rounded-2xl shadow">No records yet.<br><span class="text-sm text-gray-400">Issue a book first in Librarian / Teacher / HOD, then come back.</span></div>`;
    return;
  }

  document.getElementById('pages').innerHTML = classNames.map((cl, pageIdx)=>{
    let list=byClass[cl];
    // Sort by learner then book
    list=[...list].sort((a,b)=>(a.learner||'').localeCompare(b.learner||'') || (a.bookNo||'').localeCompare(b.bookNo||''));
    let total=list.length;
    let returned=list.filter(x=>x.returned).length;
    let still=total-returned;
    let pct=total?Math.round(returned/total*100):0;
    let teacher=list[0]?.teacher||'-';
    let dept=list[0]?.dept||'-';
    let recNo='REC-'+String(Date.now()).slice(-6)+'-'+(pageIdx+1);
    let showIssued=fType!=='returned', showReturned=fType!=='issued';

    return `
    <div class="class-page bg-white p-7 shadow my-4">
      <div class="text-center border-b-4 border-blue-950 pb-2">
        <div class="font-black text-2xl tracking-wide">WORDSWORTH HIGH SCHOOL</div>
        <div class="text-sm font-bold tracking-widest">MAKHANANI — LTSM • ISSUING / RETRIEVAL RECORD</div>
        <div class="text-xs text-gray-500">One Class Per Page • Learner Signs On Issue & On Return • File One Copy Per Class</div>
      </div>

      <div class="flex justify-between text-xs mt-2"><span>Page ${pageIdx+1} of ${classNames.length}</span><span>Record No: <b>${recNo}</b></span></div>

      <div class="grid grid-cols-3 gap-2 text-sm mt-3 border rounded-lg p-3 bg-gray-50">
        <div><b>Class:</b> ${cl}</div><div><b>Teacher:</b> ${teacher}</div><div><b>Department:</b> ${dept}</div>
        <div><b>Date:</b> ${new Date().toLocaleDateString()}</div><div><b>Term:</b> Term ____ / 2026</div><div><b>Learners in Class:</b> ${[...new Set(list.map(x=>x.learner))].length}</div>
      </div>

      <!-- ISSUED -->
      <div class="mt-4">
        <div class="font-bold bg-blue-950 text-white px-3 py-1.5 text-sm">1. BOOKS ISSUED — CLASS: ${cl} (${list.length} records)</div>
        <table class="w-full text-[13px] border-collapse"><thead><tr class="bg-gray-100"><th class="border p-1.5 text-left w-8">No</th><th class="border p-1.5 text-left">WHS No</th><th class="border p-1.5 text-left">Title / Subject</th><th class="border p-1.5 text-left">Learner</th><th class="border p-1.5 text-left">Learner ID</th><th class="border p-1.5 text-left">Date Issued</th><th class="border p-1.5 text-left">Signature (Issue)</th></tr></thead>
        <tbody>${showIssued ? list.map((x,i)=>{let it=getTitle(x.bookNo); return `<tr><td class="border p-1.5">${i+1}</td><td class="border p-1.5 font-bold">${x.bookNo}</td><td class="border p-1.5">${x.title}<br><span class="text-[11px] text-gray-400">${it?it.subject:''}</span></td><td class="border p-1.5">${x.learner}</td><td class="border p-1.5">${x.learnerId||'-'}</td><td class="border p-1.5">${x.date||'-'}</td><td class="border p-1.5 h-7"></td></tr>`}).join('') : `<tr><td colspan="7" class="border p-2 text-center">— Hidden by filter —</td></tr>`}</tbody></table>
      </div>

      <!-- RETURNED -->
      <div class="mt-4">
        <div class="font-bold bg-green-700 text-white px-3 py-1.5 text-sm">2. BOOKS RETRIEVED / RETURNED — CLASS: ${cl}</div>
        <table class="w-full text-[13px] border-collapse"><thead><tr class="bg-gray-100"><th class="border p-1.5 text-left w-8">No</th><th class="border p-1.5 text-left">WHS No</th><th class="border p-1.5 text-left">Title</th><th class="border p-1.5 text-left">Learner</th><th class="border p-1.5 text-left">Date Returned</th><th class="border p-1.5 text-left">Condition</th><th class="border p-1.5 text-left">Signature (Return)</th></tr></thead>
        <tbody>${showReturned ? (list.filter(x=>x.returned).map((x,i)=>`<tr><td class="border p-1.5">${i+1}</td><td class="border p-1.5 font-bold">${x.bookNo}</td><td class="border p-1.5">${x.title}</td><td class="border p-1.5">${x.learner}</td><td class="border p-1.5">${x.date||'-'}</td><td class="border p-1.5 text-[11px]">☐ Good &nbsp; ☐ Damaged &nbsp; ☐ Lost</td><td class="border p-1.5 h-7"></td></tr>`).join('') || `<tr><td colspan="7" class="border p-3 text-center text-gray-400">No returns yet for this class — Retrieval 0%</td></tr>`) : `<tr><td colspan="7" class="border p-2 text-center">— Hidden by filter —</td></tr>`}</tbody></table>
      </div>

      <!-- STILL OUT - IMPORTANT FOR FOLLOW-UP -->
      <div class="mt-3 border border-orange-200 rounded-lg p-2 bg-orange-50 text-sm">
        <b>⚠️ Still Out — Follow Up List (${still}):</b> ${still? list.filter(x=>!x.returned).map(x=>`${x.bookNo} — ${x.learner}`).join(' • ') : 'None — All returned ✅'}
      </div>

      <!-- SUMMARY FOR THIS CLASS -->
      <div class="mt-3 border rounded-lg p-3">
        <div class="font-bold text-sm">3. SUMMARY — THIS CLASS ONLY</div>
        <div class="grid grid-cols-4 gap-2 text-center mt-2 text-sm">
          <div class="border rounded p-2"><div class="text-[11px]">TOTAL ISSUED</div><div class="font-bold text-lg">${total}</div></div>
          <div class="border rounded p-2"><div class="text-[11px]">RETURNED</div><div class="font-bold text-lg text-green-600">${returned}</div></div>
          <div class="border rounded p-2"><div class="text-[11px]">STILL OUT</div><div class="font-bold text-lg text-orange-600">${still}</div></div>
          <div class="border rounded p-2 bg-blue-50"><div class="text-[11px]">% RETRIEVAL — THIS CLASS</div><div class="font-bold text-lg">${pct}%</div><div class="text-[11px]">${pct>=80?'✅ Excellent':pct>=50?'⚠️ Follow up':'❌ Urgent'}</div></div>
        </div>
        <div class="text-[11px] mt-1">Formula: Returned ÷ Total Issued × 100 &nbsp;•&nbsp; Example: ${returned} ÷ ${total} = ${pct}% &nbsp;•&nbsp; Target 95%+</div>
      </div>

      <!-- SIGNATURES PER CLASS PAGE -->
      <div class="grid grid-cols-3 gap-6 mt-6 text-sm">
        <div><div class="border-t-2 border-black pt-1 mt-8">Class Rep / Learner<br><span class="text-[11px]">Name & Signature & Date</span></div></div>
        <div><div class="border-t-2 border-black pt-1 mt-8">Teacher — ${teacher}<br><span class="text-[11px]">Name & Signature & Date</span></div></div>
        <div><div class="border-t-2 border-black pt-1 mt-8">HOD / Librarian<br><span class="text-[11px]">Name & Signature & Date</span></div></div>
      </div>
      <div class="text-center text-[11px] text-gray-400 mt-4">Wordsworth High School • Makhanani LTSM • Class: ${cl} • Page ${pageIdx+1}/${classNames.length} • Generated: ${new Date().toLocaleString()}</div>
    </div>`;
  }).join('');
}
render();
</script></body></html>
