<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Marks — Wordsworth High School • MAKHANANI-LTSM</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script></head>
<body class="bg-gray-100 p-4 md:p-8"><div id="nav"></div>
<h1 class="text-2xl font-black">🏆 Marks</h1><p class="text-sm text-gray-500">Wordsworth High School • MAKHANANI-LTSM • <span class="firebase-badge"><span class="bg-yellow-100 text-yellow-700 px-2 py-1 rounded-full text-xs">● Offline</span></span></p>
<div class="bg-white p-5 rounded-2xl mt-4"><h3 class="font-bold mb-3">+ Add Mark</h3><div class="grid md:grid-cols-4 gap-3"><select id="mStudent" class="border rounded-lg px-3 py-2"></select><select id="mSubject" class="border rounded-lg px-3 py-2"><option>Mathematics</option><option>Science</option><option>English</option><option>History</option><option>Geography</option><option>Life Sciences</option></select><input id="mAssessment" value="Test 1" class="border rounded-lg px-3 py-2"><input id="mMark" type="number" placeholder="Mark /100" class="border rounded-lg px-3 py-2"></div><button onclick="saveMark()" class="bg-blue-900 text-white px-6 py-2 rounded-lg mt-3 text-sm">Save Mark → Syncs to Firebase 🔥</button></div>
<div class="bg-white rounded-2xl mt-4 overflow-x-auto"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-4 text-left">Learner</th><th class="p-4 text-left">Subject</th><th class="p-4 text-left">Assessment</th><th class="p-4 text-left">Mark</th><th class="p-4 text-left">Grade</th><th class="p-4 text-left">Action</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div id="footer"></div>
<script src="shared.js"></script><script src="firebase.js"></script>
<script>
  if(!checkPageAccess('marks.html')) throw new Error('Blocked');
  startFirebaseSync();
  document.getElementById('nav').innerHTML=renderNav('marks.html');
  document.getElementById('footer').innerHTML=renderFooter();
  function gradeOf(m){ return m>=80?'A':m>=70?'B':m>=60?'C':m>=50?'D':'F'; }
  function render(){ document.getElementById('mStudent').innerHTML=users.filter(u=>u.role==='Student').map(s=>`<option value="${s.id}">${s.name} (${s.sid}) — ${s.grade} ${s.classLetter}</option>`).join(''); document.getElementById('tbody').innerHTML=marks.map(m=>`<tr class="border-t"><td class="p-4 font-semibold">${m.studentName}</td><td class="p-4">${m.subject}</td><td class="p-4">${m.assessment}</td><td class="p-4 font-bold">${m.mark}%</td><td class="p-4"><span class="px-3 py-1 rounded-full text-xs font-bold bg-blue-100">${gradeOf(m.mark)}</span></td><td class="p-4"><button onclick="del(${m.id})" class="text-red-500">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="p-6 text-center text-gray-400">No marks</td></tr>'; }
  function saveMark(){ let sid=+document.getElementById('mStudent').value, mark=+document.getElementById('mMark').value; if(isNaN(mark)) return alert('Enter mark'); let stu=users.find(u=>u.id===sid); marks.push({id:Date.now(),studentId:sid,studentName:stu?stu.name:'',subject:document.getElementById('mSubject').value,assessment:document.getElementById('mAssessment').value,mark}); saveAll(); render(); alert('✅ Mark saved — Synced 🔥'); }
  function del(id){ if(confirm('Delete?')){ marks=marks.filter(m=>m.id!==id); saveAll(); render(); } }
  render(); window.onFirebaseUpdate = render;
</script></body></html>
