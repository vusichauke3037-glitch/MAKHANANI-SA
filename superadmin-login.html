<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Super Admin Login — Xintimani Group</title><script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"}}</script></head>
<body class="bg-gray-100 min-h-screen">
<div class="bg-black text-white py-2 px-4 flex items-center gap-3 sticky top-0 z-50"><img src="logo.png" class="h-10 w-10 rounded-full bg-white border-2 border-yellow-400 p-1"><div><div class="font-black">XINTIMANI <span class="text-yellow-500">GROUP</span> • <span class="text-red-400">SUPER ADMIN</span></div><div class="text-[11px] text-gray-300">Makhanani LTSM • LIVE Firebase</div></div><div class="ml-auto"><a href="index.html" class="bg-yellow-500 text-black px-3 py-1 rounded font-bold text-xs">🏠 Home</a></div></div>
<div class="max-w-md mx-auto p-4">
<div class="bg-white rounded-2xl p-5 border-4 border-red-500 mt-4">
<h1 class="font-black text-2xl text-center">👑 Super Admin Login</h1>
<p class="text-xs text-gray-500 text-center mt-1">Only SUPER_ADMIN role can login here.<br>Normal users: Use <a href="login.html" class="text-blue-600 font-bold underline">Normal Login</a></p>
<div class="mt-4 space-y-2">
<input id="email" type="email" placeholder="Super Admin Email e.g. superadmin@xintimani.co.za" class="border-2 rounded-lg px-3 py-2 w-full">
<input id="password" type="password" placeholder="Password" class="border-2 rounded-lg px-3 py-2 w-full">
<button id="loginBtn" class="bg-red-600 text-white w-full py-3 rounded-lg font-black">👑 LOGIN AS SUPER ADMIN →</button>
<p id="msg" class="text-sm font-bold text-center"></p>
</div>
</div>
<div class="bg-white rounded-2xl p-5 border-2 border-blue-500 mt-4">
<h2 class="font-black">🆕 Create Super Admin Account (First Time Only)</h2><p class="text-xs text-gray-500">Only use once to create your Super Admin account. After that, use Login above.</p>
<div class="mt-3 space-y-2">
<input id="regName" placeholder="Full Name" class="border-2 rounded-lg px-3 py-2 w-full">
<input id="regEmail" type="email" placeholder="Super Admin Email" class="border-2 rounded-lg px-3 py-2 w-full">
<input id="regPass" type="password" placeholder="Password (min 6)" class="border-2 rounded-lg px-3 py-2 w-full">
<button id="createBtn" class="bg-blue-600 text-white w-full py-3 rounded-lg font-black">🆕 CREATE SUPER ADMIN</button>
<p id="regMsg" class="text-sm font-bold text-center"></p>
</div>
</div>
</div>
<script type="module">
import { initializeApp } from 'firebase/app';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from 'firebase/auth';
import { getFirestore, doc, setDoc, getDoc } from 'firebase/firestore';
const firebaseConfig = { apiKey: "AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA", authDomain: "makhanani-ltsm.firebaseapp.com", databaseURL: "https://makhanani-ltsm-default-rtdb.firebaseio.com", projectId: "makhanani-ltsm", storageBucket: "makhanani-ltsm.firebasestorage.app", messagingSenderId: "247180363183", appId: "1:247180363183:web:4e5a399d4e306192e01b5a", measurementId: "G-PEST1XFCR8" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
function show(m, err=true){ let el=document.getElementById('msg'); el.innerHTML=m; el.style.color=err?'#dc2626':'#16a34a'; }
function showReg(m, err=true){ let el=document.getElementById('regMsg'); el.innerHTML=m; el.style.color=err?'#dc2626':'#16a34a'; }
document.getElementById('loginBtn').addEventListener('click', async ()=>{
  let email=document.getElementById('email').value.trim().toLowerCase(); let pass=document.getElementById('password').value.trim();
  if(!email||!pass){ show('❌ Enter Email + Password'); return; }
  show('⏳ Logging in...', false);
  try{
    let cred=await signInWithEmailAndPassword(auth, email, pass);
    let snap=await getDoc(doc(db,'users', cred.user.uid));
    if(!snap.exists()){ show('❌ No Super Admin profile in Firestore. Tap CREATE SUPER ADMIN below.'); await signOut(auth); return; }
    let p=snap.data();
    if(p.role!=='SUPER_ADMIN'){ show('❌ This account is '+p.role+', not SUPER_ADMIN.<br>Use <a href="login.html" class="underline">Normal Login</a>'); await signOut(auth); return; }
    let session={school:'ALL SCHOOLS', emis:'ALL', prefix:'XG', name:p.name, role:'SUPER_ADMIN', subjects:['General'], classes:[], email:p.email, uid:cred.user.uid, isImpersonating:false};
    localStorage.removeItem('makhanani_superadmin_session'); localStorage.removeItem('makhanani_impersonating');
    localStorage.setItem('makhanani_session', JSON.stringify(session));
    show('✅ Welcome Super Admin '+p.name+' — Redirecting...', false);
    setTimeout(()=>{ location.href='superadmin-dashboard.html'; }, 800);
  }catch(e){ show('❌ '+e.message.replace('Firebase: ','')); }
});
document.getElementById('createBtn').addEventListener('click', async ()=>{
  let name=document.getElementById('regName').value.trim(); let email=document.getElementById('regEmail').value.trim().toLowerCase(); let pass=document.getElementById('regPass').value.trim();
  if(!name||!email||pass.length<6){ showReg('❌ Fill Name + Email + Password (min 6)'); return; }
  showReg('⏳ Creating Super Admin...', false);
  try{
    let cred=await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db,'users', cred.user.uid), {uid:cred.user.uid, name, email, role:'SUPER_ADMIN', emis:'ALL', school:'ALL SCHOOLS', prefix:'XG', subjects:['General'], classes:[], createdAt:new Date().toISOString()});
    showReg('✅ Super Admin Created! Now login above with '+email, false);
  }catch(e){ showReg('❌ '+e.message.replace('Firebase: ','')); }
});
</script></body></html>
