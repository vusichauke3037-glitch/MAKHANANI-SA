<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Data Recovery — Makhanani LTSM</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 min-h-screen"><div class="max-w-3xl mx-auto p-4">
<div class="bg-white rounded-2xl p-4 flex gap-3 items-center"><img src="logo.png" class="h-12 w-12 rounded-xl border-2 border-yellow-400 p-1" alt="Makhanani LTSM Logo"><div><h1 class="font-black text-2xl">🔍 Data Recovery</h1><p class="text-sm text-gray-500">Scans ALL localStorage keys. If books are under an old key, this finds them and fixes Home.</p></div></div>
<div class="bg-white rounded-2xl p-4 mt-4"><button id="scanBtn" type="button" class="bg-red-600 text-white px-6 py-2 rounded-lg font-bold">🔍 Scan All Keys Now</button><button id="fixBtn" type="button" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold ml-2">🔧 Fix / Migrate All</button></div>
<div id="result" class="bg-white rounded-2xl p-4 mt-4 text-sm"></div>
<div class="flex gap-2 mt-4"><a href="index.html" class="bg-yellow-500 text-black px-4 py-2 rounded-lg font-bold text-sm">🏠 Home</a></div>
</div>
<script>
(function(){
function scan(){
  let keys=[]; for(let i=0;i<localStorage.length;i++){ keys.push(localStorage.key(i)); }
  let html='<b>Found '+keys.length+' keys in this browser:</b><br><br>';
  keys.forEach(k=>{ let v=localStorage.getItem(k)||''; let len=0; try{ len=JSON.parse(v).length; }catch(e){ len=v.length+' chars'; } html+='<div class="border rounded p-2 mb-1"><b>'+k+'</b> — '+len+' items</div>'; });
  if(!keys.length) html='❌ No keys found. This browser has no data. Use Export on other phone.';
  document.getElementById('result').innerHTML=html;
}
document.getElementById('scanBtn').addEventListener('click',scan);
document.getElementById('fixBtn').addEventListener('click',function(){
  let keys=[]; for(let i=0;i<localStorage.length;i++){ keys.push(localStorage.key(i)); }
  let moved=0; keys.forEach(k=>{ if(k.indexOf('makhanani')<0) return; let v=localStorage.getItem(k); if(!v) return; let emis='700310854', prefix='WHS'; if(k.indexOf('911360870')>=0||k.indexOf('GSH')>=0){ emis='911360870'; prefix='GSH'; } let suffix=null; if(k.indexOf('learners')>=0) suffix='_makhanani_learners'; else if(k.indexOf('history')>=0) suffix='_makhanani_history'; else if(k.indexOf('staff')>=0) suffix='_makhanani_staff'; else if(k.indexOf('requests')>=0) suffix='_makhanani_requests'; else if(k.indexOf('ltsm')>=0) suffix='_makhanani_ltsm'; else return; let target='EMIS_'+emis+suffix; let ex=localStorage.getItem(target); let exLen=0,newLen=0; try{ exLen=ex?JSON.parse(ex).length:0; }catch(e){} try{ newLen=JSON.parse(v).length; }catch(e){} if(!ex||newLen>exLen){ localStorage.setItem(target,v); localStorage.setItem('makhanani_'+prefix+suffix,v); moved++; } });
  alert('✅ Migrated '+moved+' key(s). Go to Home — counts should now show.'); scan();
});
scan();
})();
</script>
</body></html>
