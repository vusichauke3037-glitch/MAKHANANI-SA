<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Teacher — Makhanani LTSM</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-200 min-h-screen"><script>(function(){ let e=localStorage.getItem('makhanani_active_emis'); if(!e){ location.href='school.html'; return; } window.EMIS=e; window.SCHOOL_NAME=localStorage.getItem('makhanani_active_school')||e; window.SKEY=function(k){ return 'EMIS_'+e+'_'+k; }; window.SGET=function(k,f){ try{ return JSON.parse(localStorage.getItem(SKEY(k))||JSON.stringify(f||[])); }catch(err){ return f||[]; } }; window.SSET=function(k,v){ localStorage.setItem(SKEY(k),JSON.stringify(v)); }; })();</script>
<div class="max-w-6xl mx-auto p-3 flex gap-2 flex-wrap"><span class="font-black">👩‍🏫 TEACHER DASHBOARD</span><span class="bg-blue-950 text-white px-2 py-1 rounded-full text-xs font-bold" id="badge"></span><a href="dashboard.html" class="bg-gray-800 text-white px-3 py-1 rounded font-bold text-sm">← Dashboard</a></div>
<div class="max-w-6xl mx-auto px-3 pb-6"><div class="bg-white rounded-xl shadow p-4"><div class="font-bold">Who Are You?</div><div class="flex gap-2 mt-2 flex-wrap"><select id="selTeacher" onchange="setTeacher()" class="border rounded-lg px-3 py-2 flex-1"><option value="">-- Select Your Name --</option></select><input id="manualTeacher" placeholder="Or type name" class="border rounded-lg px-3 py-2 flex-1"><button onclick="useManual()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold">Use →</button></div><p id="whoMsg" class="font-bold text-green-600 text-sm mt-1"></p></div>
<div class="grid grid-cols-3 gap-2 mt-3 text-center"><div class="bg-white rounded p-3"><div class="text-xs">ISSUED EVER</div><b id="cEver" class="text-xl">0</b></div><div class="bg-white rounded p-3"><div class="text-xs">RETURNED</div><b id="cRet" class="text-xl text-green-600">0</b></div><div class="bg-white rounded p-3"><div class="text-xs">STILL OUT</div><b id="cOut" class="text-xl text-red-600">0</b></div></div>
<div class="bg-white rounded-xl shadow p-4 mt-3"><div class="font-bold">📋 Request Books</div><div class="flex gap-2 mt-2"><input id="reqBook" placeholder="Book needed e.g. Maths Gr10 - 20 copies" class="border rounded-lg px-3 py-2 flex-1"><button onclick="addRequest()" class="bg-orange-500 text-white px-4 py-2 rounded-lg font-bold">Send Request</button></div><div id="reqList" class="mt-2 text-sm"></div></div>
<div class="bg-white rounded-xl shadow p-4 mt-3"><div class="font-bold">📖 Issue Book To Learner</div><div class="grid grid-cols-2 gap-2 mt-2"><select id="iBook" class="border rounded-lg px-3 py-2"></select><input id="iLearner" placeholder="Learner Name" class="border rounded-lg px-3 py-2"><input id="iClass" placeholder="Class e.g. Grade 10A" class="border rounded-lg px-3 py-2"><input id="iId" placeholder="Learner ID (optional)" class="border rounded-lg px-3 py-2"></div><button onclick="issueBook()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold mt-2">📖 Issue</button><p id="issueMsg" class="text-green-600 font-bold text-sm mt-1"></p></div>
<div class="bg-white rounded-xl shadow p-4 mt-3"><div class="font-bold">↩️ My Learners — Still Out / Return</div><input id="search" oninput="render()" placeholder="🔍 Search..." class="border rounded-lg px-3 py-2 w-full mt-2"><div id="myList" class="mt-2 text-sm"></div></div></div>
<script>
document.getElementById('badge').textContent='🏫 '+window.SCHOOL_NAME+' • EMIS: '+window.EMIS;
let ltsm=SGET('makhanani_ltsm',[]); let issues=SGET('makhanani_issues',[]); let requests=SGET('makhanani_requests_whs',[]); let me=localStorage.getItem('makhanani_current_teacher')||'';
function getStaff(){ let s=SGET('makhanani_staff',[]); let t=SGET('makhanani_teachers',[]); let all=[...s]; t.forEach(x=>{ if(!all.find(a=>a.name==x.name)) all.push({name:x.name,role:'Teacher',dept:x.dept}); }); return all.filter(x=>x.role=='Teacher'||x.role=='HOD'); }
function fillTeachers(){ let sel=document.getElementById('selTeacher'); let staff=getStaff(); sel.innerHTML='<option value="">-- Select Your Name --</option>'+staff.map(s=>'<option value="'+s.name+'">'+s.name+' — '+s.dept+'</option>').join(''); if(me) sel.value=me; document.getElementById('whoMsg').textContent=me?'✅ You are: '+me:''; }
function setTeacher(){ let v=document.getElementById('selTeacher').value; if(!v) return; me=v; localStorage.setItem('makhanani_current_teacher',me); document.getElementById('whoMsg').textContent='✅ You are: '+me; render(); renderReq(); }
function useManual(){ let v=document.getElementById('manualTeacher').value.trim(); if(!v){ alert('Type name'); return; } me=v; localStorage.setItem('makhanani_current_teacher',me); document.getElementById('whoMsg').textContent='✅ You are: '+me; render(); renderReq(); }
function addRequest(){ if(!me){ alert('Select name first'); return; } let b=document.getElementById('reqBook').value.trim(); if(!b){ alert('Enter book'); return; } requests.push({teacher:me,book:b,status:'Pending',date:new Date().toLocaleDateString()}); SSET('makhanani_requests_whs',requests); document.getElementById('reqBook').value=''; renderReq(); }
function renderReq(){ let mine=requests.filter(r=>r.teacher==me); document.getElementById('reqList').innerHTML=mine.length==0?'<p class="text-gray-500">No requests.</p>':mine.map(r=>'<div class="bg-gray-50 rounded p-2 mt-1"><b>'+r.book+'</b> — '+r.status+'</div>').join(''); }
function fillBooks(){ let sel=document.getElementById('iBook'); let avail=[]; ltsm.forEach((it,idx)=>{ it.copies.forEach((c,ci)=>{ if(c.status=='Available') avail.push({idx,ci,bookNo:c.bookNo,title:it.title}); }); }); sel.innerHTML=avail.length==0?'<option value="">No books available</option>':avail.map(a=>'<option value="'+a.idx+'|'+a.ci+'">'+a.title+' — '+a.bookNo+'</option>').join(''); }
function issueBook(){ if(!me){ alert('Select name first'); return; } let v=document.getElementById('iBook').value; let learner=document.getElementById('iLearner').value.trim(); let cls=document.getElementById('iClass').value.trim(); let id=document.getElementById('iId').value.trim(); if(!v||!learner){ alert('Select book + learner'); return; } let [idx,ci]=v.split('|'); let it=ltsm[idx]; let copy=it.copies[ci]; copy.status='Issued'; copy.learner=learner; issues.push({bookNo:copy.bookNo,title:it.title,learner,learnerId:id,class:cls,teacher:me,dept:it.dept,subject:it.subject||'',date:new Date().toLocaleDateString(),returned:false}); SSET('makhanani_ltsm',ltsm); SSET('makhanani_issues',issues); document.getElementById('issueMsg').textContent='✅ Issued to '+learner; document.getElementById('iLearner').value=''; fillBooks(); render(); }
function returnIssue(i){ let iss=issues[i]; if(!confirm('Mark returned?')) return; iss.returned=true; for(let it of ltsm){ let c=it.copies.find(x=>x.bookNo==iss.bookNo); if(c){ c.status='Available'; c.learner=''; } } SSET('makhanani_ltsm',ltsm); SSET('makhanani_issues',issues); fillBooks(); render(); }
function render(){ let q=(document.getElementById('search').value||'').toLowerCase(); let mine=issues.filter(x=>x.teacher==me); document.getElementById('cEver').textContent=mine.length; document.getElementById('cRet').textContent=mine.filter(x=>x.returned).length; document.getElementById('cOut').textContent=mine.filter(x=>!x.returned).length; let f=mine.filter(x=>(x.learner+' '+x.title).toLowerCase().includes(q)); document.getElementById('myList').innerHTML=f.length==0?'<p class="text-gray-500">No records.</p>':f.map(x=>{ let idx=issues.indexOf(x); return '<div class="bg-gray-50 rounded p-2 mt-1 flex justify-between"><span><b>'+x.learner+'</b> — '+x.title+' — '+(x.returned?'<span class="text-green-600 font-bold">Returned</span>':'<span class="text-red-600 font-bold">Still Out</span>')+'</span>'+(!x.returned?'<button onclick="returnIssue('+idx+')" class="bg-blue-600 text-white px-2 py-1 rounded text-xs">↩️ Return</button>':'')+'</div>'; }).join(''); }
fillTeachers(); fillBooks(); render(); renderReq();
</script></body></html>
