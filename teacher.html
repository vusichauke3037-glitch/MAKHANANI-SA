<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Teacher - Wordsworth</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 min-h-screen">
<div id="pwGuard" class="fixed inset-0 bg-green-700 flex items-center justify-center p-4 z-[100]"><div class="bg-white rounded-3xl w-full max-w-sm p-6 text-center"><div class="text-4xl">👩‍🏫</div><h2 class="font-bold text-xl mt-2">Teacher Access</h2><p class="text-sm text-gray-500">Default: <b>Teacher2026</b></p><div class="relative mt-3"><input id="pwInput" type="password" placeholder="Enter password" class="w-full border-2 rounded-lg px-3 py-3 text-center font-bold" onkeydown="if(event.key==='Enter') checkPagePw()"><button onclick="let i=document.getElementById('pwInput');i.type=i.type==='password'?'text':'password'" class="absolute right-2 top-2.5 text-xs bg-gray-100 px-2 py-1 rounded">👁 Show</button></div><div id="pwError" class="text-red-600 text-sm font-bold mt-2 hidden">❌ Wrong password.</div><button onclick="checkPagePw()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold mt-4">Unlock →</button><a href="dashboard.html" class="block text-xs underline mt-2">← Back to Dashboard</a></div></div>
<script>(function(){let p=JSON.parse(localStorage.getItem('makhanani_passwords')||'{"librarian":"Librarian2026","hod":"Hod2026","teacher":"Teacher2026","principal":"Principal2026","master":"Master2026"}');localStorage.setItem('makhanani_passwords',JSON.stringify(p));if(sessionStorage.getItem('makhanani_unlocked_teacher')==='yes'){document.getElementById('pwGuard').remove();return;}window.checkPagePw=function(){let v=document.getElementById('pwInput').value;if(v===p.teacher||v===p.master){sessionStorage.setItem('makhanani_unlocked_teacher','yes');document.getElementById('pwGuard').remove();}else{document.getElementById('pwError').classList.remove('hidden');document.getElementById('pwInput').value='';}};})();</script>
<div class="max-w-5xl mx-auto p-4"><div class="flex flex-wrap gap-2 justify-between"><h1 class="font-black text-2xl">👩‍🏫 TEACHER — ISSUE / RETURN</h1><div class="flex gap-2"><a href="dashboard.html" class="bg-purple-700 text-white px-4 py-2 rounded-lg font-bold">📊 Dashboard</a><a href="record.html" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold">📄 Record</a><button onclick="logoutAll()" class="bg-red-600 text-white px-4 py-2 rounded-lg font-bold">🔒 Logout</button></div></div>
<div class="bg-white rounded-2xl p-4 mt-4"><h2 class="font-bold">My Details (saved)</h2><div class="grid grid-cols-3 gap-2 mt-2"><input id="tName" placeholder="Teacher Name e.g. Ms. Dube" class="border rounded-lg px-3 py-2"><input id="tClass" placeholder="Class e.g. Grade 10A" class="border rounded-lg px-3 py-2"><select id="tDept" class="border rounded-lg px-3 py-2"><option>Mathematics</option><option>Sciences</option><option>Languages</option><option>Commerce</option><option>Humanities</option><option>Technology</option></select></div><button onclick="saveTeacher()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold mt-2">Save My Details</button></div>
<div class="bg-white rounded-2xl p-4 mt-4"><h2 class="font-bold">📤 Issue Book To Learner</h2><div class="bg-yellow-50 border border-yellow-300 rounded-lg p-2 text-center text-sm font-bold mt-2">📚 DUE DATE: <span class="text-red-600">30 NOVEMBER <span id="dueYearTeacher"></span></span> — Tell learner: "Return by 30 November or you pay"</div><div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-2"><input id="iBook" placeholder="WHS No e.g. WHS001" class="border rounded-lg px-3 py-2"><input id="iLearner" placeholder="Learner Name" class="border rounded-lg px-3 py-2"><input id="iLearnerId" placeholder="Learner ID" class="border rounded-lg px-3 py-2"><button onclick="issueBook()" class="bg-green-600 text-white py-2 rounded-lg font-bold">Issue →</button></div><div id="issueMsg" class="text-sm mt-1"></div></div>
<div class="bg-white rounded-2xl p-4 mt-4"><h2 class="font-bold">📥 Return Book</h2><div class="grid grid-cols-2 gap-2 mt-2"><input id="rBook" placeholder="WHS No to return" class="border rounded-lg px-3 py-2"><button onclick="returnBook()" class="bg-blue-600 text-white py-2 rounded-lg font-bold">Return Book</button></div><div id="returnMsg" class="text-sm mt-1"></div></div>
<div class="bg-white rounded-2xl p-4 mt-4"><h2 class="font-bold">My Issues — <span id="myCount"></span></h2><div id="myList" class="mt-2 space-y-1"></div></div></div>
<script>
let ltsm=JSON.parse(localStorage.getItem('makhanani_ltsm')||'[]');let issues=JSON.parse(localStorage.getItem('makhanani_issues')||'[]');let teacher=JSON.parse(localStorage.getItem('makhanani_teacher')||'{"name":"","class":"","dept":"Mathematics"}');
document.getElementById('tName').value=teacher.name||'';document.getElementById('tClass').value=teacher.class||'';document.getElementById('tDept').value=teacher.dept||'Mathematics';
function getDueDate(){let n=new Date();let d=new Date(n.getFullYear(),10,30);if(n>d)d=new Date(n.getFullYear()+1,10,30);return d;}
function isOverdue(x){let n=new Date();let d=new Date(n.getFullYear(),10,30);return !x.returned&&n>d;}
document.getElementById('dueYearTeacher').textContent=getDueDate().getFullYear();
function save(){localStorage.setItem('makhanani_ltsm',JSON.stringify(ltsm));localStorage.setItem('makhanani_issues',JSON.stringify(issues));localStorage.setItem('makhanani_teacher',JSON.stringify(teacher));}
function logoutAll(){if(!confirm('Logout?'))return;sessionStorage.clear();location.href='dashboard.html';}
function saveTeacher(){teacher={name:document.getElementById('tName').value.trim(),class:document.getElementById('tClass').value.trim(),dept:document.getElementById('tDept').value};save();render();alert('✅ Saved: '+teacher.name+' — '+teacher.class);}
function findCopy(no){for(let it of ltsm){let c=it.copies.find(x=>x.bookNo===no);if(c)return {it,c};}return null;}
function issueBook(){let no=document.getElementById('iBook').value.trim().toUpperCase(),learner=document.getElementById('iLearner').value.trim(),lid=document.getElementById('iLearnerId').value.trim();if(!teacher.name){alert('Save your details first');return;}if(!no||!learner){alert('Fill WHS No + Learner');return;}let f=findCopy(no);if(!f){document.getElementById('issueMsg').innerHTML='<span class="text-red-600 font-bold">❌ WHS No not found</span>';return;}if(f.c.status!=='Available'){document.getElementById('issueMsg').innerHTML='<span class="text-red-600 font-bold">❌ Already issued</span>';return;}f.c.status='Issued';issues.push({bookNo:no,title:f.it.title,subject:f.it.subject,dept:teacher.dept,teacher:teacher.name,class:teacher.class,learner,learnerId:lid,date:new Date().toLocaleDateString(),returned:false});save();render();document.getElementById('issueMsg').innerHTML=`<span class="text-green-600 font-bold">✅ Issued ${no} (${f.it.title}) to ${learner} — Due 30 Nov ${getDueDate().getFullYear()}</span>`;document.getElementById('iBook').value='';document.getElementById('iLearner').value='';}
function returnBook(){let no=document.getElementById('rBook').value.trim().toUpperCase();let f=findCopy(no);if(!f){document.getElementById('returnMsg').innerHTML='<span class="text-red-600">❌ Not found</span>';return;}let iss=issues.find(x=>x.bookNo===no&&!x.returned);if(!iss){document.getElementById('returnMsg').innerHTML='<span class="text-red-600">❌ Not currently issued</span>';return;}f.c.status='Available';iss.returned=true;iss.date=new Date().toLocaleDateString();save();render();document.getElementById('returnMsg').innerHTML=`<span class="text-green-600 font-bold">✅ Returned ${no} — ${iss.learner}</span>`;document.getElementById('rBook').value='';}
function render(){let mine=issues.filter(x=>x.teacher===teacher.name);let ov=mine.filter(x=>isOverdue(x)).length;document.getElementById('myCount').innerHTML=mine.length+' records • '+mine.filter(x=>!x.returned).length+' still out • <span class="text-red-600">'+ov+' overdue</span>';document.getElementById('myList').innerHTML=mine.map(x=>{let o=isOverdue(x);return `<div class="border rounded p-2 flex justify-between text-sm ${o?'bg-red-50 border-red-200':''}"><span><b>${x.bookNo}</b> — ${x.title} → ${x.learner} (${x.class})<br><span class="text-[11px] text-gray-500">Due: 30 Nov ${getDueDate().getFullYear()}</span></span><span class="${x.returned?'text-green-600':'text-orange-600'} font-bold">${x.returned?'✅ Returned':o?'❌ OVERDUE':'⏳ Out — Due 30 Nov'}</span></div>`;}).join('')||'<div class="text-gray-400 text-center">No issues yet</div>';}
render();
let _t;function resetT(){clearTimeout(_t);_t=setTimeout(()=>{sessionStorage.clear();alert('⏰ Auto-logged out.');location.href='dashboard.html';},15*60*1000);}['click','keydown','touchstart'].forEach(e=>document.addEventListener(e,resetT));resetT();
</script></body></html>
