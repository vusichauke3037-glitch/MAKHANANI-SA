<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Teacher Dashboard — Makhanani LTSM</title><script src="https://cdn.tailwindcss.com"></script><script src="subscription-guard.js"></script></head>
<body class="bg-gray-100 min-h-screen">
<div class="bg-black text-white py-2 px-4 flex items-center gap-3 sticky top-0 z-50"><img src="logo.png" class="h-10 w-10 rounded-full bg-white border-2 border-yellow-400 p-1" alt="Makhanani LTSM Logo"><div><div class="font-black">XINTIMANI <span class="text-yellow-500">GROUP</span> • TEACHER</div><div class="text-[11px] text-gray-300" id="topStatus">Loading...</div></div><div class="ml-auto flex gap-2 flex-wrap"><a href="index.html" class="bg-yellow-500 text-black px-3 py-1 rounded font-bold text-xs">🏠 Home</a></div></div>
<div class="max-w-6xl mx-auto p-4">
<div class="bg-white rounded-2xl p-4"><h1 class="font-black text-2xl">👩‍🏫 Teacher Dashboard</h1><p class="text-xs text-gray-500" id="schoolLine">Loading...</p></div>
<div id="subBanner" class="bg-blue-50 border-2 border-blue-300 rounded-2xl p-3 mt-4 text-sm font-bold hidden"></div>
<div class="bg-white rounded-2xl p-4 mt-4 border-2 border-green-500"><h2 class="font-black">📥 Request Books — For Your Class</h2><p class="text-xs text-gray-500">Request goes to HOD / Principal / Librarian for approval. Approved = ready to issue.</p><div class="grid md:grid-cols-3 gap-2 mt-3"><select id="reqSubject" class="border-2 rounded-lg px-3 py-2 font-bold"><option value="">-- Subject --</option></select><input id="reqTitle" placeholder="Book Title e.g. Mathematics Grade 10" class="border-2 rounded-lg px-3 py-2 font-bold"><input id="reqGrade" placeholder="Grade e.g. 10" class="border-2 rounded-lg px-3 py-2"></div><div class="grid md:grid-cols-2 gap-2 mt-2"><input id="reqQty" type="number" min="1" value="1" placeholder="Qty" class="border-2 rounded-lg px-3 py-2 font-bold"><input id="reqNote" placeholder="Note e.g. For 10A, 30 learners" class="border-2 rounded-lg px-3 py-2"></div><button id="reqBtn" class="bg-green-600 text-white px-6 py-2 rounded-lg font-black mt-3">📥 Send Request</button><p id="reqMsg" class="text-sm font-bold mt-2"></p></div>
<div class="bg-white rounded-2xl p-4 mt-4"><h2 class="font-black">📋 My Requests — Status</h2><div id="myReqList" class="mt-2 text-sm"></div></div>
<div class="bg-white rounded-2xl p-4 mt-4"><h2 class="font-black">📚 Books — My Subjects — View Only</h2><div id="bookList" class="mt-2 text-sm"></div></div>
</div>
<script>
(function(){
let cur=null, books=[], requests=[];
function render(){
  try{ cur=JSON.parse(localStorage.getItem('makhanani_session')||'null'); }catch(e){ cur=null; }
  if(!cur){ document.getElementById('schoolLine').innerHTML='❌ NOT LOGGED IN — <a href="login.html" class="underline text-blue-600 font-black">Go to login</a>'; return; }
  let sc=window.checkSubscription?window.checkSubscription(cur.school, cur.emis, {block:true}):null; if(sc && sc.locked && !sc.adminBypass) return;
  document.getElementById('topStatus').textContent=cur.name+' • '+cur.role+' • '+cur.school+' • EMIS '+cur.emis;
  document.getElementById('schoolLine').innerHTML='School: <b>'+cur.school+'</b> • EMIS: <b>'+cur.emis+'</b> • Subjects: <b>'+(cur.subjects||[]).join(', ')+'</b> • Classes: <b>'+(cur.classes||[]).join(', ')+'</b>';
  if(window.showSubBanner) window.showSubBanner('subBanner', cur.school, cur.emis);
  try{ books=JSON.parse(localStorage.getItem('EMIS_'+cur.emis+'_makhanani_ltsm')||'[]'); }catch(e){ books=[]; }
  try{ requests=JSON.parse(localStorage.getItem('EMIS_'+cur.emis+'_makhanani_requests')||'[]'); }catch(e){ requests=[]; }
  let subjects=[]; try{ subjects=JSON.parse(localStorage.getItem('EMIS_'+cur.emis+'_makhanani_subjects')||'[]'); }catch(e){}
  document.getElementById('reqSubject').innerHTML='<option value="">-- Subject --</option>'+subjects.map(s=>'<option value="'+s.name+'">'+s.name+'</option>').join('');
  let mySubs=cur.subjects||[]; let isGeneral=mySubs.includes('General');
  let myBooks=isGeneral?books:books.filter(b=>mySubs.some(s=> (b.subject||'').toLowerCase().includes(s.toLowerCase())));
  document.getElementById('bookList').innerHTML=myBooks.map(b=>'<div class="border rounded p-2 mb-1"><b>'+b.title+'</b> • '+(b.subject||'')+' • Grade '+(b.grade||'')+' • Copies '+(b.copies||[]).length+' • Available '+(b.copies||[]).filter(c=>c.status==='Available').length+'</div>').join('')||'<p class="text-gray-500">No books for your subjects yet.</p>';
  let myReq=requests.filter(r=>r.by===cur.name);
  document.getElementById('myReqList').innerHTML=myReq.map(r=>'<div class="border rounded p-2 mb-1"><b>'+r.title+'</b> • Subject '+(r.subject||'—')+' • Grade '+r.grade+' • Qty '+r.qty+' • Status: <b>'+r.status+'</b> • '+(r.date||'')+'</div>').join('')||'<p class="text-gray-500">No requests yet. Send one above.</p>';
}
document.getElementById('reqBtn').addEventListener('click',function(){
  let title=document.getElementById('reqTitle').value.trim(); if(!title){ alert('Type Book Title'); return; }
  let subject=document.getElementById('reqSubject').value; let grade=document.getElementById('reqGrade').value.trim(); let qty=parseInt(document.getElementById('reqQty').value)||1; let note=document.getElementById('reqNote').value.trim();
  requests.push({title:title, subject:subject, grade:grade, qty:qty, note:note, by:cur.name, status:'Pending', date:new Date().toISOString().slice(0,10)});
  localStorage.setItem('EMIS_'+cur.emis+'_makhanani_requests', JSON.stringify(requests));
  document.getElementById('reqMsg').innerHTML='✅ Request sent for <b>'+title+'</b> — Waiting for HOD / Principal approval.';
  document.getElementById('reqTitle').value=''; render();
});
render();
})();
</script>
</body></html>
