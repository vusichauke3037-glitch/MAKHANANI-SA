<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Stock — Wordsworth High School • MAKHANANI-LTSM</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script><style>.barcode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.barcode-label{border:1.5px dashed #111;border-radius:8px;padding:6px 4px;text-align:center;height:148px;display:flex;flex-direction:column;justify-content:space-between}@media print{body *{visibility:hidden}#sheet,#sheet *{visibility:visible}#sheet{position:absolute;left:0;top:0;width:100%}}</style></head>
<body class="bg-gray-100 p-4 md:p-8"><div id="nav"></div>
<h1 class="text-2xl font-black">📚 Stock — MAKHANANI-LTSM</h1><p class="text-sm text-gray-500">Wordsworth High School • 1 Book = 1 Barcode (MA000001) • <span class="firebase-badge"><span class="bg-yellow-100 text-yellow-700 px-2 py-1 rounded-full text-xs">● Offline</span></span></p>
<div class="flex gap-2 mt-4 flex-wrap"><button onclick="openPrint()" class="bg-amber-400 px-4 py-2 rounded-lg text-sm font-bold">🖨️ Print Barcodes A4 3x5</button><button onclick="openScan()" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm">📷 Scan — Beep</button><button onclick="exportStock()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm">Export</button><button onclick="openAdd()" class="bg-blue-900 text-white px-4 py-2 rounded-lg text-sm">+ Add Title</button></div>
<div class="bg-white p-4 rounded-2xl mt-4"><h3 class="font-bold">📤 Quick Issue</h3><div class="flex gap-2 mt-2"><input id="issueBookNo" placeholder="Book No MA000001" class="flex-1 border rounded-lg px-3 py-2 text-sm font-bold"><input id="issueLearner" placeholder="Learner ID 10A001" class="flex-1 border rounded-lg px-3 py-2 text-sm font-bold"><button onclick="issueByInputs()" class="bg-blue-900 text-white px-4 py-2 rounded-lg text-sm">Issue →</button></div></div>
<div id="grid" class="grid md:grid-cols-3 gap-4 mt-4"></div>
<div id="printBox" class="hidden bg-white p-5 rounded-2xl mt-4"><h3 class="font-bold">🖨️ Print Barcodes — A4 3x5 — WORDSWORTH HIGH SCHOOL • MAKHANANI-LTSM</h3><div class="flex gap-2 mt-3 flex-wrap"><select id="pfType" class="border rounded-lg px-3 py-2 text-sm"><option value="all">ALL</option><option value="title">Per Title</option><option value="grade">Per Grade</option><option value="subject">Per Subject</option><option value="dept">Per Dept</option><option value="learner">LEARNER</option></select><select id="pfVal" class="border rounded-lg px-3 py-2 text-sm"><option value="">— All —</option></select><select id="pfLabel" class="border rounded-lg px-3 py-2 text-sm"><option value="BOOK">BOOK</option><option value="LEARNER">LEARNER</option></select><button onclick="genSheet()" class="bg-blue-900 text-white px-4 py-2 rounded-lg text-sm">Generate →</button><button onclick="window.print()" class="bg-gray-100 px-4 py-2 rounded-lg text-sm">Print A4</button></div><div id="sheet" class="mt-4"></div></div>
<div id="scanBox" class="hidden bg-white p-5 rounded-2xl mt-4"><div id="qr-reader" class="bg-black min-h-[280px] rounded-xl"></div><div class="flex gap-2 mt-3"><input id="manual" placeholder="Type MA000001 or 10A001" class="flex-1 border rounded-lg px-3 py-2"><button onclick="onScan(document.getElementById('manual').value)" class="bg-blue-900 text-white px-4 py-2 rounded-lg">Search</button></div><p id="scanRes" class="text-sm mt-2"></p></div>
<div class="bg-white rounded-2xl mt-4 overflow-x-auto"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-4 text-left">Learner</th><th class="p-4 text-left">Book No</th><th class="p-4 text-left">Title</th><th class="p-4 text-left">Due</th><th class="p-4 text-left">Status</th><th class="p-4 text-left">Action</th></tr></thead><tbody id="issueTbody"></tbody></table></div>
<div id="footer"></div>
<script src="shared.js"></script><script src="firebase.js"></script>
<script>
  if(!checkPageAccess('stock.html')) throw new Error('Blocked');
  startFirebaseSync();
  document.getElementById('nav').innerHTML=renderNav('stock.html');
  document.getElementById('footer').innerHTML=renderFooter();
  let params=new URLSearchParams(location.search); if(params.get('learner')) document.getElementById('issueLearner').value=params.get('learner');
  function renderStock(){
    document.getElementById('grid').innerHTML=ltsm.map(it=>`<div class="bg-white p-5 rounded-2xl"><h3 class="font-bold">${it.title}</h3><p class="text-xs text-gray-500">${it.dept} • ${it.grade} • ${it.subject}</p><p class="text-xs font-bold text-blue-900">${it.copies.map(c=>c.bookNo).slice(0,3).join(', ')}${it.copies.length>3?' ...':''}</p><p class="text-sm mt-2">Total ${it.copies.length} • Avail ${getAvailable(it)}</p><button onclick="printTitle(${it.id})" class="bg-amber-400 px-3 py-1 rounded-lg text-xs font-bold mt-3">🖨️ Barcodes</button> <button onclick="delTitle(${it.id})" class="text-red-500 text-xs">Delete</button></div>`).join('')||'<p class="text-gray-400">No stock — Use Bulk Upload in import.html</p>';
    document.getElementById('issueTbody').innerHTML=issues.slice().reverse().map(i=>`<tr class="border-t"><td class="p-4">${i.toName} (${i.toSID})</td><td class="p-4 font-bold text-blue-900">${i.bookNo}</td><td class="p-4">${i.itemTitle}</td><td class="p-4">${i.due}</td><td class="p-4">${i.status}</td><td class="p-4">${i.status!=='Returned'&&i.status!=='Lost'?`<button onclick="doReturn(${i.id})" class="bg-blue-900 text-white px-3 py-1 rounded-lg text-xs">Return</button>`:'—'}</td></tr>`).join('');
  }
  function openAdd(){ let title=prompt('Title?'); if(!title) return; let qty=+prompt('How many physical copies?','30'); let item={id:Date.now(),title,dept:'Mathematics',grade:'Grade 10',subject:'Mathematics',price:350,min:5,copies:[],qty:0}; for(let i=0;i<qty;i++) item.copies.push({bookNo:getNextUniqueBookNo(),status:'Available',issuedTo:null}); item.qty=item.copies.length; ltsm.push(item); saveAll(); renderStock(); alert('✅ '+qty+' copies — each with unique MA barcode — Synced to Firebase 🔥'); }
  function delTitle(id){ if(confirm('Delete title?')){ ltsm=ltsm.filter(x=>x.id!==id); saveAll(); renderStock(); } }
  function issueByInputs(){ let bookNo=document.getElementById('issueBookNo').value.trim().toUpperCase(), sid=document.getElementById('issueLearner').value.trim().toUpperCase(); if(!bookNo||!sid) return alert('Enter Book No + Learner ID'); issueOne(bookNo,sid); }
  function issueOne(bookNo, learnerSID){ let learner=users.find(u=>u.sid===learnerSID.toUpperCase()); if(!learner) return alert('Learner not found: '+learnerSID); let found=null; for(let it of ltsm){ let c=it.copies.find(x=>x.bookNo===bookNo); if(c){found={item:it,copy:c}; break;} } if(!found) return alert('Book not found'); if(found.copy.status!=='Available') return alert('Already issued to '+found.copy.issuedTo); found.copy.status='Issued'; found.copy.issuedTo=learnerSID.toUpperCase(); issues.push({id:Date.now(), bookNo, itemId:found.item.id, itemTitle:found.item.title, toId:learner.id, toName:learner.name, toSID:learner.sid, qty:1, issued:new Date().toISOString().slice(0,10), due:new Date(Date.now()+30*86400000).toISOString().slice(0,10), status:'Issued'}); beep(); saveAll(); renderStock(); alert('✅ '+bookNo+' → '+learner.name+' ('+learner.sid+') — Synced 🔥'); }
  function doReturn(id){ let iss=issues.find(i=>i.id===id); if(!iss) return; iss.status='Returned'; for(let it of ltsm){ let c=it.copies.find(x=>x.bookNo===iss.bookNo); if(c){ c.status='Available'; c.issuedTo=null; } } saveAll(); renderStock(); alert('✅ Returned '+iss.bookNo); }
  function openPrint(){ document.getElementById('printBox').classList.remove('hidden'); let t=document.getElementById('pfType'); t.onchange=()=>{ let vals=[]; if(t.value==='title') vals=ltsm.map(x=>x.title); if(t.value==='grade') vals=[...new Set(ltsm.map(x=>x.grade))]; if(t.value==='subject') vals=[...new Set(ltsm.map(x=>x.subject))]; if(t.value==='dept') vals=[...new Set(ltsm.map(x=>x.dept))]; if(t.value==='learner') vals=[...new Set(users.filter(u=>u.role==='Student').map(u=>u.grade+' '+u.classLetter))]; document.getElementById('pfVal').innerHTML='<option value="">— All —</option>'+vals.map(v=>`<option>${v}</option>`).join(''); }; }
  function printTitle(id){ openPrint(); document.getElementById('pfType').value='title'; document.getElementById('pfType').dispatchEvent(new Event('change')); setTimeout(()=>{ let it=ltsm.find(x=>x.id===id); if(it) document.getElementById('pfVal').value=it.title; genSheet(); },100); }
  function genSheet(){ let type=document.getElementById('pfType').value, val=document.getElementById('pfVal').value, labelType=document.getElementById('pfLabel').value; let labels=[]; if(labelType==='LEARNER'||type==='learner'){ let list=users.filter(u=>u.role==='Student'); if(val) list=list.filter(u=>(u.grade+' '+u.classLetter)===val); labels=list.map(u=>({code:u.sid,title:u.name})); } else { let items=[...ltsm]; if(type==='title') items=items.filter(x=>x.title===val); if(type==='grade') items=items.filter(x=>x.grade===val); if(type==='subject') items=items.filter(x=>x.subject===val); if(type==='dept') items=items.filter(x=>x.dept===val); items.forEach(it=>it.copies.forEach(c=>labels.push({code:c.bookNo, title:it.title}))); } if(!labels.length) return alert('No labels'); document.getElementById('sheet').innerHTML=`<div class="barcode-grid">`+labels.map(l=>`<div class="barcode-label"><div><div style="font-size:9px;font-weight:900">WORDSWORTH HIGH SCHOOL</div><div style="font-size:8px;color:#1e3a8a;font-weight:700">MAKHANANI-LTSM</div><span style="font-size:9px;background:#1e3a8a;color:#fff;padding:1px 6px;border-radius:999px;font-weight:900">${labelType}</span></div><svg class="bc" data-code="${l.code}"></svg><div style="font-weight:900">${l.code}</div><div style="font-size:7px">${l.title}</div></div>`).join('')+`</div><p class="text-xs text-center mt-2">${labels.length} labels • ${Math.ceil(labels.length/15)} A4 pages • 3x5 = 15 per page</p>`; document.querySelectorAll('.bc').forEach(s=>{ try{ JsBarcode(s,s.dataset.code,{format:'CODE128',width:1.6,height:52,displayValue:false,margin:0}); }catch(e){} }); beep(); }
  function openScan(){ document.getElementById('scanBox').classList.remove('hidden'); try{ let qr=new Html5Qrcode("qr-reader"); qr.start({facingMode:"environment"},{fps:10,qrbox:250},t=>onScan(t),()=>{}); }catch(e){} }
  function onScan(code){ beep(); code=code.trim().toUpperCase(); let found=null; for(let it of ltsm){ let c=it.copies.find(x=>x.bookNo===code); if(c) found={item:it,copy:c}; } if(found){ document.getElementById('scanRes').innerHTML=`✅ <b>${code}</b> — ${found.item.title} — ${found.copy.status} ${found.copy.issuedTo?'→ '+found.copy.issuedTo:''}`; return; } let learner=users.find(u=>u.sid===code); if(learner){ document.getElementById('scanRes').innerHTML=`✅ Learner <b>${code}</b> — ${learner.name} — ${learner.grade} ${learner.classLetter} • ${learner.phone||'No contact'}`; return; } document.getElementById('scanRes').innerHTML=`❌ Not found: ${code}`; }
  function exportStock(){ let data=[["MAKHANANI-LTSM — Wordsworth High School"],["A Product of Xintimani Group Holdings (PTY) LTD • Reg: 2026 / 934898 / 07"],[""],["Title","Dept","Grade","Subject","BookNo","Status","IssuedTo"]]; ltsm.forEach(it=>it.copies.forEach(c=>data.push([it.title,it.dept,it.grade,it.subject,c.bookNo,c.status,c.issuedTo||'']))); let ws=XLSX.utils.aoa_to_sheet(data); let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Stock"); XLSX.writeFile(wb,"MAKHANANI-LTSM_Stock.xlsx"); }
  renderStock(); window.onFirebaseUpdate = renderStock;
</script></body></html>
