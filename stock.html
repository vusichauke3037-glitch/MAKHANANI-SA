<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Stock — Makhanani LTSM 2.0</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="shared.js"></script><style>.barcode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.barcode-label{border:1.5px dashed #111;border-radius:8px;padding:6px 4px;text-align:center;height:148px;display:flex;flex-direction:column;justify-content:space-between}@media print{body *{visibility:hidden}#sheet,#sheet *{visibility:visible}#sheet{position:absolute;left:0;top:0;width:100%}}</style></head>
<body class="bg-gray-100 p-4 md:p-8"><div id="nav"></div>
<h1 class="text-2xl font-black">📚 Stock — MAKHANANI LTSM 2.0</h1><p class="text-sm text-gray-500">1 Book = 1 Barcode (MA000001) • Organized: Dept → Grade → Subject</p>
<div class="flex gap-2 mt-4 flex-wrap"><button onclick="openPrint()" class="bg-amber-400 px-4 py-2 rounded-lg text-sm font-bold">🖨️ Print Barcodes A4 3x5</button><button onclick="openScan()" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm">📷 Scan — Beep</button><button onclick="exportStock()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm">Export</button></div>
<div id="grid" class="grid md:grid-cols-3 gap-4 mt-4"></div>
<!-- Print Modal -->
<div id="printBox" class="hidden bg-white p-5 rounded-2xl mt-4"><h3 class="font-bold">🖨️ Print Barcodes — A4 3x5</h3><div class="flex gap-2 mt-3"><select id="pfType" class="border rounded-lg px-3 py-2 text-sm"><option value="all">ALL</option><option value="title">Per Title</option><option value="grade">Per Grade</option><option value="subject">Per Subject</option><option value="dept">Per Dept</option></select><select id="pfVal" class="border rounded-lg px-3 py-2 text-sm"><option value="">— All —</option></select><button onclick="genSheet()" class="bg-blue-900 text-white px-4 py-2 rounded-lg text-sm">Generate →</button><button onclick="window.print()" class="bg-gray-100 px-4 py-2 rounded-lg text-sm">Print A4</button></div><div id="sheet" class="mt-4"></div></div>
<!-- Scan -->
<div id="scanBox" class="hidden bg-white p-5 rounded-2xl mt-4"><div id="qr-reader" class="bg-black min-h-[280px] rounded-xl"></div><div class="flex gap-2 mt-3"><input id="manual" placeholder="Type MA000001 or 10A001" class="flex-1 border rounded-lg px-3 py-2"><button onclick="onScan(document.getElementById('manual').value)" class="bg-blue-900 text-white px-4 py-2 rounded-lg">Search</button></div><p id="scanRes" class="text-sm mt-2"></p></div>
<script>
document.getElementById('nav').innerHTML=renderNav('stock.html');
// Auto-fill learner from learners.html link ?learner=10A001
let params=new URLSearchParams(location.search); if(params.get('learner')){ document.getElementById('issueLearner').value=params.get('learner'); }
function renderStock(){ document.getElementById('grid').innerHTML=ltsm.map(it=>`<div class="bg-white p-5 rounded-2xl"><h3 class="font-bold">${it.title}</h3><p class="text-xs text-gray-500">${it.dept} • ${it.grade} • ${it.subject}</p><p class="text-xs font-bold text-blue-900">${it.copies.map(c=>c.bookNo).slice(0,3).join(', ')}${it.copies.length>3?' ...':''}</p><p class="text-sm mt-2">Total ${it.copies.length} • Avail ${getAvailable(it)}</p><div class="flex gap-2 mt-3"><input id="issue-${it.id}" placeholder="Learner ID 10A001" class="flex-1 border rounded-lg px-2 py-1 text-sm"><button onclick="issueOne('${it.copies.find(c=>c.status==='Available')?.bookNo||''}', document.getElementById('issue-${it.id}').value)" class="bg-blue-900 text-white px-3 py-1 rounded-lg text-xs">Issue →</button></div></div>`).join('')||'No stock — Use Bulk Upload in import.html'; }
function issueOne(bookNo, learnerSID){ if(!bookNo) return alert('No available copy'); if(!learnerSID) return alert('Enter Learner ID e.g. 10A001'); let learner=users.find(u=>u.sid===learnerSID.toUpperCase()); if(!learner) return alert('Learner not found'); let found=null; for(let it of ltsm){ let c=it.copies.find(x=>x.bookNo===bookNo); if(c){found={item:it,copy:c}; break;} } if(found.copy.status!=='Available') return alert('Already issued'); found.copy.status='Issued'; found.copy.issuedTo=learnerSID.toUpperCase(); issues.push({id:Date.now(), bookNo, itemId:found.item.id, itemTitle:found.item.title, toId:learner.id, toName:learner.name, toSID:learner.sid, qty:1, issued:new Date().toISOString().slice(0,10), due:new Date(Date.now()+30*86400000).toISOString().slice(0,10), status:'Issued'}); beep(); saveAll(); renderStock(); alert('✅ '+bookNo+' → '+learner.name+' ('+learner.sid+')'); }
function openPrint(){ document.getElementById('printBox').classList.remove('hidden'); let t=document.getElementById('pfType'); t.onchange=()=>{ let vals=[]; if(t.value==='title') vals=ltsm.map(x=>x.title); if(t.value==='grade') vals=[...new Set(ltsm.map(x=>x.grade))]; if(t.value==='subject') vals=[...new Set(ltsm.map(x=>x.subject))]; if(t.value==='dept') vals=[...new Set(ltsm.map(x=>x.dept))]; document.getElementById('pfVal').innerHTML='<option value="">— All —</option>'+vals.map(v=>`<option>${v}</option>`).join(''); }; }
function genSheet(){ let type=document.getElementById('pfType').value, val=document.getElementById('pfVal').value; let labels=[]; let items=[...ltsm]; if(type==='title') items=items.filter(x=>x.title===val); if(type==='grade') items=items.filter(x=>x.grade===val); if(type==='subject') items=items.filter(x=>x.subject===val); if(type==='dept') items=items.filter(x=>x.dept===val); items.forEach(it=>it.copies.forEach(c=>labels.push({code:c.bookNo, title:it.title}))); if(!labels.length) return alert('No labels'); document.getElementById('sheet').innerHTML=`<div class="barcode-grid">`+labels.map(l=>`<div class="barcode-label"><div><div style="font-size:9px;font-weight:900">MAKHANANI ACADEMY</div><div style="font-size:8px;color:#1e3a8a;font-weight:700">MAKHANANI LTSM 2.0</div><span style="font-size:9px;background:#1e3a8a;color:#fff;padding:1px 6px;border-radius:999px;font-weight:900">BOOK</span></div><svg class="bc" data-code="${l.code}"></svg><div style="font-weight:900">${l.code}</div><div style="font-size:7px">${l.title}</div></div>`).join('')+`</div><p class="text-xs text-center mt-2">${labels.length} labels • ${Math.ceil(labels.length/15)} A4 pages</p>`; document.querySelectorAll('.bc').forEach(s=>{ try{ JsBarcode(s,s.dataset.code,{format:'CODE128',width:1.6,height:52,displayValue:false,margin:0}); }catch(e){} }); beep(); }
function openScan(){ document.getElementById('scanBox').classList.remove('hidden'); let qr=new Html5Qrcode("qr-reader"); qr.start({facingMode:"environment"},{fps:10,qrbox:250},t=>onScan(t),()=>{}); }
function onScan(code){ beep(); code=code.trim().toUpperCase(); let found=null; for(let it of ltsm){ let c=it.copies.find(x=>x.bookNo===code); if(c) found={item:it,copy:c}; } if(found){ document.getElementById('scanRes').innerHTML=`✅ <b>${code}</b> — ${found.item.title} — ${found.copy.status} ${found.copy.issuedTo?'→ '+found.copy.issuedTo:''}`; return; } let learner=users.find(u=>u.sid===code); if(learner){ document.getElementById('scanRes').innerHTML=`✅ Learner <b>${code}</b> — ${learner.name} — ${learner.grade} ${learner.classLetter} • ${learner.phone||'No contact'}`; return; } document.getElementById('scanRes').innerHTML=`❌ Not found: ${code}`; }
function exportStock(){ let data=[["Title","Dept","Grade","Subject","BookNo","Status","IssuedTo"]]; ltsm.forEach(it=>it.copies.forEach(c=>data.push([it.title,it.dept,it.grade,it.subject,c.bookNo,c.status,c.issuedTo||'']))); let ws=XLSX.utils.aoa_to_sheet(data); let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Stock"); XLSX.writeFile(wb,"Makhanani_Stock.xlsx"); }
renderStock();
</script></body></html>
