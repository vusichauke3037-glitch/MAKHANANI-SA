<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HOD — Makhanani LTSM</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-200 min-h-screen"><script>(function(){ let e=localStorage.getItem('makhanani_active_emis'); if(!e){ location.href='school.html'; return; } window.EMIS=e; window.SCHOOL_NAME=localStorage.getItem('makhanani_active_school')||e; window.PREFIX=e==='700310854'?'WHS':e==='911360870'?'GSH':localStorage.getItem('makhanani_active_school_short')||'WHS'; window.SKEY=function(k){ return 'EMIS_'+e+'_'+k; }; window.PKEY=function(k){ return 'makhanani_'+window.PREFIX+'_'+k; }; window.SGET=function(k,f){ try{ let a=JSON.parse(localStorage.getItem(SKEY(k))||'[]'); let b=JSON.parse(localStorage.getItem(PKEY(k))||'[]'); if(k==='makhanani_ltsm'&&(a.length||b.length)){ let by={}; [...a,...b].forEach(it=>{ if(!by[it.title]) by[it.title]=JSON.parse(JSON.stringify(it)); else { let ex=by[it.title]; let bars=new Set(ex.copies.map(x=>x.barcode||x.bookNo)); it.copies.forEach(cp=>{ if(!bars.has(cp.barcode||cp.bookNo)) ex.copies.push(cp); }); } }); return Object.values(by); } return a.length>=b.length?a:(b.length?b:(f||[])); }catch(err){ return f||[]; } }; window.SSET=function(k,v){ localStorage.setItem(SKEY(k),JSON.stringify(v)); localStorage.setItem(PKEY(k),JSON.stringify(v)); if(window.PREFIX==='WHS') localStorage.setItem('makhanani_'+k,JSON.stringify(v)); if(k==='makhanani_issues'){ localStorage.setItem(SKEY('makhanani_history'),JSON.stringify(v)); localStorage.setItem(PKEY('makhanani_history'),JSON.stringify(v)); } }; })();</script>
<div class="max-w-6xl mx-auto p-3 flex gap-2 flex-wrap"><span class="font-black">👑 HOD DASHBOARD</span><span class="bg-blue-950 text-white px-2 py-1 rounded-full text-xs font-bold" id="badge"></span><a href="dashboard.html" class="bg-gray-800 text-white px-3 py-1 rounded font-bold text-sm">← Dashboard</a><a href="staff.html" class="bg-violet-700 text-white px-3 py-1 rounded font-bold text-sm">👥 Staff</a><a href="index.html" class="bg-black text-white px-3 py-1 rounded font-bold text-sm">🏠 Lending Page</a></div>
<div class="max-w-6xl mx-auto px-3 pb-6"><div class="bg-white rounded-xl shadow p-4"><div class="font-bold">Who Are You?</div><div class="flex gap-2 mt-2 flex-wrap"><select id="selHod" onchange="setHod()" class="border rounded-lg px-3 py-2 flex-1"><option value="">-- Select HOD --</option></select><select id="selDept" onchange="setDept()" class="border rounded-lg px-3 py-2"><option>Commerce</option><option>Mathematics</option><option>Sciences</option><option>Languages</option><option>Humanities</option><option>Technology</option><option>Whole School</option></select></div><p id="whoMsg" class="font-bold text-orange-600 text-sm mt-1"></p></div>
<div class="grid grid-cols-4 gap-2 mt-3 text-center"><div class="bg-white rounded p-3"><div class="text-xs">STOCK</div><b id="cStock" class="text-xl">0</b></div><div class="bg-white rounded p-3"><div class="text-xs">ISSUED EVER</div><b id="cEver" class="text-xl">0</b></div><div class="bg-white rounded p-3"><div class="text-xs">RETURNED</div><b id="cRet" class="text-xl text-green-600">0</b></div><div class="bg-white rounded p-3"><div class="text-xs">STILL OUT</div><b id="cOut" class="text-xl text-red-600">0</b></div></div>
<div class="bg-white rounded-xl shadow p-4 mt-3"><div class="font-bold">📋 Teacher Requests — Approve / Decline</div><div id="reqList" class="mt-2 text-sm"></div></div>
<div class="bg-white rounded-xl shadow p-4 mt-3"><div class="font-bold">➕ Add New HOD / Teacher</div><div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-2"><input id="nName" placeholder="Full Name" class="border rounded-lg px-3 py-2"><select id="nRole" class="border rounded-lg px-3 py-2"><option>HOD</option><option>Teacher</option></select><select id="nDept" class="border rounded-lg px-3 py-2"><option>Commerce</option><option>Mathematics</option><option>Sciences</option><option>Languages</option><option>Humanities</option><option>Technology</option></select><input id="nSubject" placeholder="Subject" class="border rounded-lg px-3 py-2"></div><button onclick="addStaff()" class="bg-orange-500 text-white px-4 py-2 rounded-lg font-bold mt-2">✅ Save</button><p id="addMsg" class="text-green-600 font-bold text-sm mt-1"></p></div>
<div class="bg-white rounded-xl shadow p-4 mt-3"><div class="font-bold">👥 My Dept Staff</div><div id="staffList" class="mt-2 text-sm"></div></div>
<div class="bg-white rounded-xl shadow p-4 mt-3"><div class="font-bold">❌ Overdue In My Dept</div><div id="overdueList" class="mt-2 text-sm"></div></div></div>
<script>
document.getElementById('badge').textContent='🏫 '+window.SCHOOL_NAME+' • EMIS: '+window.EMIS;
let ltsm=SGET('makhanani_ltsm',[]); let issues=SGET('makhanani_issues',[]); let requests=SGET('makhanani_requests_whs',[]);
let me=localStorage.getItem('makhanani_current_hod')||''; let myDept=localStorage.getItem('makhanani_current_hod_dept')||'Commerce';
function bookDept(it){ return it.dept || it.subject || ''; }
function getStaff(){ let s=SGET('makhanani_staff',[]); let h=SGET('makhanani_hods',[]); let t=SGET('makhanani_teachers',[]); let all=[...s]; h.forEach(x=>{ if(!all.find(a=>a.name==x.name)) all.push({name:x.name,role:'HOD',dept:x.dept}); }); t.forEach(x=>{ if(!all.find(a=>a.name==x.name)) all.push({name:x.name,role:'Teacher',dept:x.dept}); }); return all; }
function fillHods(){ let staff=getStaff().filter(x=>x.role=='HOD'); let sel=document.getElementById('selHod'); sel.innerHTML='<option value="">-- Select HOD --</option>'+staff.map(s=>'<option value="'+s.name+'|'+s.dept+'">'+s.name+' — '+s.dept+'</option>').join(''); if(me) sel.value=me+'|'+myDept; document.getElementById('selDept').value=myDept; document.getElementById('whoMsg').textContent=me?'✅ HOD: '+me+' • Dept: '+myDept:'Select HOD + Dept'; }
function setHod(){ let v=document.getElementById('selHod').value; if(!v) return; let [n,d]=v.split('|'); me=n; myDept=d; localStorage.setItem('makhanani_current_hod',me); localStorage.setItem('makhanani_current_hod_dept',myDept); document.getElementById('selDept').value=myDept; document.getElementById('whoMsg').textContent='✅ HOD: '+me+' • Dept: '+myDept; render(); }
function setDept(){ myDept=document.getElementById('selDept').value; localStorage.setItem('makhanani_current_hod_dept',myDept); render(); }
function addStaff(){ let name=document.getElementById('nName').value.trim(); let role=document.getElementById('nRole').value; let dept=document.getElementById('nDept').value; let subj=document.getElementById('nSubject').value.trim(); if(!name){ alert('Enter name'); return; } let staff=SGET('makhanani_staff',[]); let user=name.toLowerCase().replace(/[^a-z]/g,'')+(role=='HOD'?'_hod':''); staff.push({name,role,dept,subj,phone:'',user,pass:'1234'}); SSET('makhanani_staff',staff); if(role=='HOD'){ let h=SGET('makhanani_hods',[]); h.push({name,dept,phone:'',user,pass:'1234'}); SSET('makhanani_hods',h); } if(role=='Teacher'){ let t=SGET('makhanani_teachers',[]); t.push({name,dept,subj,phone:'',user,pass:'1234'}); SSET('makhanani_teachers',t); } document.getElementById('addMsg').textContent='✅ '+name+' added as '+role; fillHods(); render(); }
function approve(i){ requests[i].status='Approved'; SSET('makhanani_requests_whs',requests); render(); }
function decline(i){ requests[i].status='Declined'; SSET('makhanani_requests_whs',requests); render(); }
function render(){ let df=myDept=='Whole School'?null:myDept; let stock=0; ltsm.forEach(it=>{ if(!df||bookDept(it)===df) stock+=it.copies.length; }); let iss=issues.filter(x=>!df||(x.dept||x.subject)===df); document.getElementById('cStock').textContent=stock; document.getElementById('cEver').textContent=iss.length; document.getElementById('cRet').textContent=iss.filter(x=>x.returned).length; document.getElementById('cOut').textContent=iss.filter(x=>!x.returned).length; document.getElementById('reqList').innerHTML=requests.length==0?'<p class="text-gray-500">No requests.</p>':requests.map(r=>{ let idx=requests.indexOf(r); return '<div class="bg-gray-50 rounded p-2 mt-1 flex justify-between"><span><b>'+r.teacher+'</b> — '+r.book+' — <b>'+r.status+'</b></span><span><button onclick="approve('+idx+')" class="bg-green-600 text-white px-2 py-1 rounded text-xs">Approve</button> <button onclick="decline('+idx+')" class="bg-red-600 text-white px-2 py-1 rounded text-xs">Decline</button></span></div>'; }).join(''); let staff=getStaff().filter(s=>!df||s.dept==df); document.getElementById('staffList').innerHTML=staff.length==0?'<p class="text-gray-500">No staff.</p>':staff.map(s=>'<span class="inline-block bg-gray-100 px-2 py-1 rounded font-bold mr-1 mt-1">'+s.role+': '+s.name+'</span>').join(''); let over=iss.filter(x=>!x.returned); document.getElementById('overdueList').innerHTML=over.length==0?'<p class="text-green-600 font-bold">✅ No overdue!</p>':over.map(x=>'<div class="bg-red-50 rounded p-2 mt-1"><b>'+x.learner+'</b> — '+(x.title||x.book)+' — '+(x.bookNo||x.barcode)+'</div>').join(''); }
fillHods(); render();
</script></body></html>
