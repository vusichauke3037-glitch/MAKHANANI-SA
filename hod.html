<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HOD - Wordsworth</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 min-h-screen">
<div id="pwGuard" class="fixed inset-0 bg-orange-600 flex items-center justify-center p-4 z-[100]"><div class="bg-white rounded-3xl w-full max-w-sm p-6 text-center"><div class="text-4xl">🧑‍🏫</div><h2 class="font-bold text-xl mt-2">HOD Access</h2><p class="text-sm text-gray-500">Default: <b>Hod2026</b></p><div class="relative mt-3"><input id="pwInput" type="password" placeholder="Enter password" class="w-full border-2 rounded-lg px-3 py-3 text-center font-bold" onkeydown="if(event.key==='Enter') checkPagePw()"><button onclick="let i=document.getElementById('pwInput');i.type=i.type==='password'?'text':'password'" class="absolute right-2 top-2.5 text-xs bg-gray-100 px-2 py-1 rounded">👁 Show</button></div><div id="pwError" class="text-red-600 text-sm font-bold mt-2 hidden">❌ Wrong password.</div><button onclick="checkPagePw()" class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold mt-4">Unlock →</button><a href="dashboard.html" class="block text-xs underline mt-2">← Back to Dashboard</a></div></div>
<script>(function(){let passwords=JSON.parse(localStorage.getItem('makhanani_passwords')||'{"librarian":"Librarian2026","hod":"Hod2026","teacher":"Teacher2026","principal":"Principal2026","master":"Master2026"}');localStorage.setItem('makhanani_passwords',JSON.stringify(passwords));if(sessionStorage.getItem('makhanani_unlocked_hod')==='yes'){document.getElementById('pwGuard').remove();return;}window.checkPagePw=function(){let v=document.getElementById('pwInput').value;if(v===passwords.hod||v===passwords.master){sessionStorage.setItem('makhanani_unlocked_hod','yes');document.getElementById('pwGuard').remove();}else{document.getElementById('pwError').classList.remove('hidden');document.getElementById('pwInput').value='';}};setTimeout(()=>document.getElementById('pwInput').focus(),200);})();</script>
<div class="max-w-5xl mx-auto p-4">
<div class="flex flex-wrap gap-2 justify-between"><h1 class="font-black text-2xl">🧑‍🏫 HOD — DEPARTMENT</h1><div class="flex gap-2"><a href="dashboard.html" class="bg-purple-700 text-white px-4 py-2 rounded-lg font-bold">📊 Dashboard</a><a href="record.html" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold">📄 Record</a><button onclick="logoutAll()" class="bg-red-600 text-white px-4 py-2 rounded-lg font-bold">🔒 Logout</button></div></div>
<div class="bg-white rounded-2xl p-4 mt-4"><h2 class="font-bold">My Department</h2><div class="flex gap-2 mt-2"><select id="hDept" class="border rounded-lg px-3 py-2"><option>Mathematics</option><option>Sciences</option><option>Languages</option><option>Commerce</option><option>Humanities</option><option>Technology</option></select><input id="hName" placeholder="HOD Name e.g. Mr. Smith" class="border rounded-lg px-3 py-2"><button onclick="saveHod()" class="bg-orange-500 text-white px-4 py-2 rounded-lg font-bold">Save</button></div></div>
<div class="grid grid-cols-4 gap-2 mt-4 text-center"><div class="bg-white rounded-lg p-3"><div class="text-xs">DEPT STOCK</div><div id="cStock" class="font-bold text-xl">0</div></div><div class="bg-white rounded-lg p-3"><div class="text-xs">ISSUED EVER</div><div id="cIssued" class="font-bold text-xl">0</div></div><div class="bg-white rounded-lg p-3"><div class="text-xs">RETURNED</div><div id="cRetN" class="font-bold text-xl text-green-600">0</div></div><div class="bg-white rounded-lg p-3"><div class="text-xs">% RETRIEVAL</div><div id="cRet" class="font-bold text-xl">0%</div></div></div>
<div class="bg-white rounded-2xl p-4 mt-4"><h2 class="font-bold">Issues In My Department — <span id="deptLabel"></span></h2><div id="list" class="mt-2 space-y-1"></div></div>
</div>
<script>
let ltsm=JSON.parse(localStorage.getItem('makhanani_ltsm')||'[]');let issues=JSON.parse(localStorage.getItem('makhanani_issues')||'[]');let hod=JSON.parse(localStorage.getItem('makhanani_hod')||'{"dept":"Mathematics","name":""}');
document.getElementById('hDept').value=hod.dept;document.getElementById('hName').value=hod.name||'';
function logoutAll(){if(!confirm('Logout?'))return;sessionStorage.clear();location.href='dashboard.html';}
function saveHod(){hod={dept:document.getElementById('hDept').value,name:document.getElementById('hName').value.trim()};localStorage.setItem('makhanani_hod',JSON.stringify(hod));render();alert('✅ Saved HOD: '+hod.name+' — '+hod.dept);}
function render(){let deptIssues=issues.filter(x=>x.dept===hod.dept);let ret=deptIssues.filter(x=>x.returned).length;let out=deptIssues.filter(x=>!x.returned).length;let stock=0;ltsm.filter(x=>x.dept===hod.dept).forEach(it=>stock+=it.copies.length);document.getElementById('cStock').textContent=stock;document.getElementById('cIssued').textContent=ret+out;document.getElementById('cRetN').textContent=ret;document.getElementById('cRet').textContent=(ret+out?Math.round(ret/(ret+out)*100):0)+'%';document.getElementById('deptLabel').textContent=hod.dept+' • '+(hod.name||'');document.getElementById('list').innerHTML=deptIssues.map(x=>`<div class="border rounded p-2 flex justify-between text-sm"><span><b>${x.bookNo}</b> — ${x.title} → ${x.learner} (${x.class}) • ${x.teacher}</span><span class="${x.returned?'text-green-600':'text-orange-600'} font-bold">${x.returned?'✅ Returned':'⏳ Out'}</span></div>`).join('')||'<div class="text-gray-400 text-center">No issues in this dept yet</div>';}
render();
let _t;function resetT(){clearTimeout(_t);_t=setTimeout(()=>{sessionStorage.clear();alert('⏰ Auto-logged out.');location.href='dashboard.html';},15*60*1000);}['click','keydown','touchstart'].forEach(e=>document.addEventListener(e,resetT));resetT();
</script></body></html>
