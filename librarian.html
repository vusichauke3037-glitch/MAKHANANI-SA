<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Librarian Dashboard - Wordsworth High School</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- HEADER -->
<div class="bg-blue-950 text-white px-4 py-4 sticky top-0 z-40 shadow">
  <div class="max-w-7xl mx-auto flex flex-wrap gap-2 items-center justify-between">
    <div>
      <div class="font-bold text-lg leading-none">WORDSWORTH HIGH SCHOOL • MAKHANANI - LTSM</div>
      <div class="text-xs opacity-80 mt-1">Librarian Dashboard</div>
    </div>
    <div class="flex flex-wrap gap-2">
      <a href="stock.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold">📚 Go to Stock →</a>
      <button onclick="openIssue()" class="bg-green-500 text-white px-4 py-2 rounded-lg font-bold">+ Issue Book</button>
      <button onclick="openReturn()" class="bg-yellow-400 text-black px-4 py-2 rounded-lg font-bold">↩ Return Book</button>
    </div>
  </div>
</div>

<div class="max-w-7xl mx-auto p-4">
  <!-- STATS -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
    <div class="bg-white rounded-2xl p-4 shadow"><div class="text-xs text-gray-500">TOTAL COPIES</div><div id="stTotal" class="text-2xl font-bold">0</div></div>
    <div class="bg-white rounded-2xl p-4 shadow"><div class="text-xs text-gray-500">AVAILABLE</div><div id="stAvail" class="text-2xl font-bold text-green-600">0</div></div>
    <div class="bg-white rounded-2xl p-4 shadow"><div class="text-xs text-gray-500">ISSUED OUT</div><div id="stIssued" class="text-2xl font-bold text-orange-600">0</div></div>
    <div class="bg-white rounded-2xl p-4 shadow"><div class="text-xs text-gray-500">TITLES</div><div id="stTitles" class="text-2xl font-bold">0</div></div>
  </div>

  <!-- SEARCH + ISSUED LIST -->
  <div class="bg-white rounded-2xl p-4 shadow mt-4 flex flex-wrap gap-2">
    <input id="search" oninput="render()" placeholder="🔍 Search WHS number, title, learner..." class="flex-1 min-w-[220px] border rounded-lg px-3 py-2">
    <select id="fGrade" onchange="render()" class="border rounded-lg px-3 py-2"><option value="">All Grades</option><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select>
    <button onclick="document.getElementById('search').value='';document.getElementById('fGrade').value='';render()" class="bg-gray-100 px-3 py-2 rounded-lg">Clear</button>
  </div>

  <div class="bg-white rounded-2xl p-4 shadow mt-4">
    <div class="font-bold">📋 Issued Books — Who Has What</div>
    <div id="issuedList" class="mt-3 space-y-2"></div>
    <div id="noIssued" class="text-center text-gray-400 py-8 hidden">No books issued yet.<br>Click + Issue Book to issue.</div>
  </div>

  <div class="bg-white rounded-2xl p-4 shadow mt-4">
    <div class="font-bold">📚 All Titles — Quick View</div>
    <div id="titleList" class="mt-3 grid md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
  </div>

  <div class="text-center mt-6">
    <a href="stock.html" class="inline-block bg-blue-900 text-white px-6 py-3 rounded-xl font-bold">📚 Manage Stock & Print Barcodes →</a>
  </div>
</div>

<!-- ISSUE MODAL -->
<div id="issueModal" class="hidden fixed inset-0 bg-black/50 flex items-start justify-center p-4 z-50 overflow-y-auto">
  <div class="bg-white rounded-3xl w-full max-w-md p-6 my-2 max-h-[92vh] overflow-y-auto">
    <div class="flex justify-between"><h2 class="font-bold text-xl">+ Issue Book</h2><button onclick="closeIssue()" class="text-2xl">×</button></div>
    <label class="text-xs font-bold mt-3 block">BOOK NUMBER (WHS...)</label>
    <input id="issueBookNo" placeholder="WHS000001" class="w-full border rounded-lg px-3 py-2">
    <label class="text-xs font-bold mt-2 block">LEARNER NAME</label>
    <input id="issueLearner" placeholder="Full name" class="w-full border rounded-lg px-3 py-2">
    <label class="text-xs font-bold mt-2 block">GRADE / CLASS</label>
    <select id="issueGrade" class="w-full border rounded-lg px-3 py-2"><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select>
    <div class="flex gap-2 mt-4 sticky bottom-0 bg-white pt-2"><button onclick="closeIssue()" class="flex-1 bg-gray-100 py-3 rounded-lg">Cancel</button><button onclick="saveIssue()" class="flex-1 bg-green-600 text-white py-3 rounded-lg font-bold">Issue →</button></div>
  </div>
</div>

<!-- RETURN MODAL -->
<div id="returnModal" class="hidden fixed inset-0 bg-black/50 flex items-start justify-center p-4 z-50 overflow-y-auto">
  <div class="bg-white rounded-3xl w-full max-w-md p-6 my-2">
    <div class="flex justify-between"><h2 class="font-bold text-xl">↩ Return Book</h2><button onclick="closeReturn()" class="text-2xl">×</button></div>
    <label class="text-xs font-bold mt-3 block">BOOK NUMBER (WHS...)</label>
    <input id="returnBookNo" placeholder="WHS000001" class="w-full border rounded-lg px-3 py-2">
    <div class="flex gap-2 mt-4"><button onclick="closeReturn()" class="flex-1 bg-gray-100 py-3 rounded-lg">Cancel</button><button onclick="saveReturn()" class="flex-1 bg-yellow-400 py-3 rounded-lg font-bold">Return →</button></div>
  </div>
</div>

<script>
let ltsm=JSON.parse(localStorage.getItem('makhanani_ltsm')||'[]');
let issues=JSON.parse(localStorage.getItem('makhanani_issues')||'[]');
function saveAll(){localStorage.setItem('makhanani_ltsm',JSON.stringify(ltsm));localStorage.setItem('makhanani_issues',JSON.stringify(issues));}
function openIssue(){document.getElementById('issueModal').classList.remove('hidden');}
function closeIssue(){document.getElementById('issueModal').classList.add('hidden');}
function openReturn(){document.getElementById('returnModal').classList.remove('hidden');}
function closeReturn(){document.getElementById('returnModal').classList.add('hidden');}
function findCopy(no){ for(let it of ltsm){ for(let c of it.copies){ if(c.bookNo.toUpperCase()===no.toUpperCase()) return {it,c}; } } return null; }
function saveIssue(){
  let no=document.getElementById('issueBookNo').value.trim(); let learner=document.getElementById('issueLearner').value.trim(); let grade=document.getElementById('issueGrade').value;
  if(!no||!learner){alert('Enter Book No + Learner');return;}
  let f=findCopy(no); if(!f){alert('Book not found: '+no);return;}
  if(f.c.status!=='Available'){alert('Already issued to '+f.c.learner);return;}
  f.c.status='Issued'; f.c.learner=learner; f.c.date=new Date().toLocaleDateString();
  issues.unshift({bookNo:f.c.bookNo,title:f.it.title,learner,grade,date:f.c.date,returned:false});
  saveAll(); closeIssue(); render(); alert(`✅ ${no} issued to ${learner}`);
}
function saveReturn(){
  let no=document.getElementById('returnBookNo').value.trim(); if(!no){alert('Enter Book No');return;}
  let f=findCopy(no); if(!f){alert('Book not found');return;}
  f.c.status='Available'; f.c.learner=''; f.c.date='';
  let iss=issues.find(x=>x.bookNo.toUpperCase()===no.toUpperCase()&&!x.returned); if(iss) iss.returned=true;
  saveAll(); closeReturn(); render(); alert(`✅ ${no} returned — Available again`);
}
function returnByNo(no){ document.getElementById('returnBookNo').value=no; saveReturn(); }
function render(){
  let total=0, avail=0; ltsm.forEach(it=>it.copies.forEach(c=>{total++; if(c.status==='Available') avail++;}));
  document.getElementById('stTotal').textContent=total;
  document.getElementById('stAvail').textContent=avail;
  document.getElementById('stIssued').textContent=total-avail;
  document.getElementById('stTitles').textContent=ltsm.length;
  let q=(document.getElementById('search').value||'').toLowerCase();
  let fg=document.getElementById('fGrade').value;
  let active=issues.filter(x=>!x.returned && (!q || x.bookNo.toLowerCase().includes(q)||x.title.toLowerCase().includes(q)||x.learner.toLowerCase().includes(q)) && (!fg || x.grade===fg));
  document.getElementById('noIssued').classList.toggle('hidden', active.length>0);
  document.getElementById('issuedList').innerHTML=active.map(x=>`<div class="flex flex-wrap gap-2 justify-between border rounded-xl p-3"><div><b>${x.bookNo}</b> • ${x.title}<br><span class="text-sm text-gray-500">${x.learner} • ${x.grade} • ${x.date}</span></div><button onclick="returnByNo('${x.bookNo}')" class="bg-yellow-400 px-3 py-1 rounded-lg font-bold text-sm">↩ Return</button></div>`).join('') || '<div class="text-gray-400 text-sm">No issued books matching search.</div>';
  let filtered=ltsm.filter(it=>!q||it.title.toLowerCase().includes(q)||it.copies.some(c=>c.bookNo.toLowerCase().includes(q)));
  document.getElementById('titleList').innerHTML=filtered.map(it=>{let av=it.copies.filter(c=>c.status==='Available').length; return `<div class="border rounded-xl p-3"><div class="font-bold">${it.title}</div><div class="text-xs text-gray-500">${it.grade} • ${it.subject} • ${it.author}</div><div class="text-sm mt-1">Total: ${it.copies.length} • Avail: ${av} • Issued: ${it.copies.length-av}</div><div class="text-xs text-blue-900 font-bold">${it.copies[0]?it.copies[0].bookNo+' → '+it.copies[it.copies.length-1].bookNo:'No copies'}</div></div>`}).join('')||'<div class="text-gray-400">No titles yet. Go to Stock to add.</div>';
}
render();
</script>
</body>
</html>
