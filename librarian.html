<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Librarian - Wordsworth</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 min-h-screen">
<div id="pwGuard" class="fixed inset-0 bg-blue-950 flex items-center justify-center p-4 z-[100]"><div class="bg-white rounded-3xl w-full max-w-sm p-6 text-center"><div class="text-4xl">📚</div><h2 class="font-bold text-xl mt-2">Librarian Access</h2><p class="text-sm text-gray-500">Default: <b>Librarian2026</b></p><div class="relative mt-3"><input id="pwInput" type="password" placeholder="Enter password" class="w-full border-2 rounded-lg px-3 py-3 text-center font-bold" onkeydown="if(event.key==='Enter') checkPagePw()"><button onclick="let i=document.getElementById('pwInput');i.type=i.type==='password'?'text':'password'" class="absolute right-2 top-2.5 text-xs bg-gray-100 px-2 py-1 rounded">👁 Show</button></div><div id="pwError" class="text-red-600 text-sm font-bold mt-2 hidden">❌ Wrong password.</div><button onclick="checkPagePw()" class="w-full bg-blue-950 text-white py-3 rounded-lg font-bold mt-4">Unlock →</button><a href="dashboard.html" class="block text-xs underline mt-2">← Back to Dashboard</a></div></div>
<script>(function(){let p=JSON.parse(localStorage.getItem('makhanani_passwords')||'{"librarian":"Librarian2026","hod":"Hod2026","teacher":"Teacher2026","principal":"Principal2026","master":"Master2026"}');localStorage.setItem('makhanani_passwords',JSON.stringify(p));if(sessionStorage.getItem('makhanani_unlocked_librarian')==='yes'){document.getElementById('pwGuard').remove();return;}window.checkPagePw=function(){let v=document.getElementById('pwInput').value;if(v===p.librarian||v===p.master){sessionStorage.setItem('makhanani_unlocked_librarian','yes');document.getElementById('pwGuard').remove();}else{document.getElementById('pwError').classList.remove('hidden');document.getElementById('pwInput').value='';}};})();</script>
<div class="max-w-6xl mx-auto p-4"><div class="flex flex-wrap gap-2 justify-between"><h1 class="font-black text-2xl">📚 WORDSWORTH — LIBRARIAN</h1><div class="flex gap-2"><a href="dashboard.html" class="bg-purple-700 text-white px-4 py-2 rounded-lg font-bold">📊 Dashboard</a><a href="record.html" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold">📄 Record</a><button onclick="logoutAll()" class="bg-red-600 text-white px-4 py-2 rounded-lg font-bold">🔒 Logout</button></div></div>
<div class="mt-2 bg-yellow-50 border border-yellow-300 rounded-lg p-2 text-center text-sm font-bold">📚 ALL BOOKS DUE: <span class="text-red-600">30 NOVEMBER EVERY YEAR</span> • Collect in last week of November</div>
<div class="grid grid-cols-4 gap-2 mt-4 text-center"><div class="bg-white rounded-lg p-3"><div class="text-xs">TOTAL STOCK</div><div id="cTotal" class="font-bold text-xl">0</div></div><div class="bg-white rounded-lg p-3"><div class="text-xs">AVAILABLE</div><div id="cAvail" class="font-bold text-xl text-green-600">0</div></div><div class="bg-white rounded-lg p-3"><div class="text-xs">ISSUED OUT</div><div id="cOut" class="font-bold text-xl text-orange-600">0</div></div><div class="bg-white rounded-lg p-3"><div class="text-xs">% RETRIEVAL</div><div id="cRet" class="font-bold text-xl">0%</div></div></div>
<div class="bg-white rounded-2xl p-4 mt-4"><h2 class="font-bold">➕ Add New Stock</h2><div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-2"><select id="nDept" class="border rounded-lg px-3 py-2"><option>Mathematics</option><option>Sciences</option><option>Languages</option><option>Commerce</option><option>Humanities</option><option>Technology</option></select><input id="nSubject" placeholder="Subject e.g. Maths" class="border rounded-lg px-3 py-2"><input id="nTitle" placeholder="Title e.g. Maths Gr10" class="border rounded-lg px-3 py-2"><input id="nGrade" placeholder="Grade e.g. Grade 10A" class="border rounded-lg px-3 py-2"><input id="nFrom" placeholder="From No e.g. WHS001" class="border rounded-lg px-3 py-2"><input id="nTo" placeholder="To No e.g. WHS030" class="border rounded-lg px-3 py-2"><input id="nPrice" type="number" placeholder="Price (R)" class="border rounded-lg px-3 py-2"><button onclick="addStock()" class="bg-blue-950 text-white py-2 rounded-lg font-bold">Add Stock →</button></div></div>
<div class="bg-white rounded-2xl p-4 mt-4"><div class="flex justify-between"><h2 class="font-bold">📦 Stock List</h2><input id="search" oninput="render()" placeholder="Search title / WHS No..." class="border rounded-lg px-3 py-1"></div><div id="list" class="mt-2 space-y-2"></div></div></div>
<script>
let ltsm=JSON.parse(localStorage.getItem('makhanani_ltsm')||'[]');let issues=JSON.parse(localStorage.getItem('makhanani_issues')||'[]');
function save(){localStorage.setItem('makhanani_ltsm',JSON.stringify(ltsm));localStorage.setItem('makhanani_issues',JSON.stringify(issues));}
function logoutAll(){if(!confirm('Logout?'))return;sessionStorage.clear();location.href='dashboard.html';}
function addStock(){let dept=document.getElementById('nDept').value,subject=document.getElementById('nSubject').value.trim(),title=document.getElementById('nTitle').value.trim(),grade=document.getElementById('nGrade').value.trim(),from=document.getElementById('nFrom').value.trim().toUpperCase(),to=document.getElementById('nTo').value.trim().toUpperCase(),price=+document.getElementById('nPrice').value||0;if(!subject||!title||!from||!to){alert('Fill Subject, Title, From, To');return;}let prefix=from.replace(/[0-9]+$/,'');let start=parseInt(from.replace(prefix,'')),end=parseInt(to.replace(prefix,''));if(isNaN(start)||isNaN(end)||end<start){alert('Check WHS range');return;}let copies=[];for(let i=start;i<=end;i++){copies.push({bookNo:prefix+String(i).padStart(3,'0'),status:'Available'});}ltsm.push({dept,subject,title,grade,price,copies});save();render();alert(`✅ Added ${copies.length} books: ${from} to ${to}`);['nSubject','nTitle','nGrade','nFrom','nTo','nPrice'].forEach(id=>document.getElementById(id).value='');}
function delItem(idx){if(!confirm('Delete this title?'))return;ltsm.splice(idx,1);save();render();}
function render(){let total=0,avail=0;ltsm.forEach(it=>it.copies.forEach(c=>{total++;if(c.status==='Available')avail++;}));let ret=issues.filter(x=>x.returned).length;let out=issues.filter(x=>!x.returned).length;let p=ret+out?Math.round(ret/(ret+out)*100):0;document.getElementById('cTotal').textContent=total;document.getElementById('cAvail').textContent=avail;document.getElementById('cOut').textContent=out;document.getElementById('cRet').textContent=p+'%';let q=(document.getElementById('search').value||'').toLowerCase();document.getElementById('list').innerHTML=ltsm.map((it,idx)=>{let av=it.copies.filter(c=>c.status==='Available').length;return `<div class="border rounded-lg p-3 flex justify-between"><div><b>${it.title}</b> • ${it.subject} • ${it.dept} • ${it.grade||''} • R${it.price||0}<br><span class="text-xs text-gray-500">${it.copies[0].bookNo} to ${it.copies[it.copies.length-1].bookNo} • ${av}/${it.copies.length} available</span></div><div class="flex gap-2"><a href="teacher.html" class="bg-green-600 text-white px-3 py-1 rounded text-sm">Issue →</a><button onclick="delItem(${idx})" class="bg-red-100 text-red-600 px-3 py-1 rounded text-sm">Delete</button></div></div>`;}).filter((_,i)=>{let it=ltsm[i];return !q||it.title.toLowerCase().includes(q)||it.subject.toLowerCase().includes(q);}).join('')||'<div class="text-center text-gray-400 p-4">No stock yet. Add stock above.</div>';}
render();
let _t;function resetT(){clearTimeout(_t);_t=setTimeout(()=>{sessionStorage.clear();alert('⏰ Auto-logged out.');location.href='dashboard.html';},15*60*1000);}['click','keydown','touchstart'].forEach(e=>document.addEventListener(e,resetT));resetT();
</script></body></html>
