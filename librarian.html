<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Librarian — Makhanani LTSM</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-200 min-h-screen"><script>(function(){ let e=localStorage.getItem('makhanani_active_emis'); if(!e){ location.href='school.html'; return; } window.EMIS=e; window.SCHOOL_NAME=localStorage.getItem('makhanani_active_school')||e; window.PREFIX=e==='700310854'?'WHS':e==='911360870'?'GSH':localStorage.getItem('makhanani_active_school_short')||'WHS'; window.SKEY=function(k){ return 'EMIS_'+e+'_'+k; }; window.PKEY=function(k){ return 'makhanani_'+window.PREFIX+'_'+k; }; window.SGET=function(k,f){ try{ let a=JSON.parse(localStorage.getItem(SKEY(k))||'[]'); let b=JSON.parse(localStorage.getItem(PKEY(k))||'[]'); if(k==='makhanani_ltsm'&&(a.length||b.length)){ let by={}; [...a,...b].forEach(it=>{ if(!by[it.title]) by[it.title]=JSON.parse(JSON.stringify(it)); else { let ex=by[it.title]; let bars=new Set(ex.copies.map(x=>x.barcode||x.bookNo)); it.copies.forEach(cp=>{ if(!bars.has(cp.barcode||cp.bookNo)) ex.copies.push(cp); }); } }); return Object.values(by); } return a.length>=b.length?a:(b.length?b:(f||[])); }catch(err){ return f||[]; } }; window.SSET=function(k,v){ localStorage.setItem(SKEY(k),JSON.stringify(v)); localStorage.setItem(PKEY(k),JSON.stringify(v)); if(window.PREFIX==='WHS') localStorage.setItem('makhanani_'+k,JSON.stringify(v)); if(k==='makhanani_issues'){ localStorage.setItem(SKEY('makhanani_history'),JSON.stringify(v)); localStorage.setItem(PKEY('makhanani_history'),JSON.stringify(v)); } }; })();</script>
<div class="max-w-6xl mx-auto p-3 flex gap-2 flex-wrap"><span class="font-black">📚 LIBRARIAN DASHBOARD</span><span class="bg-blue-950 text-white px-2 py-1 rounded-full text-xs font-bold" id="badge"></span><a href="dashboard.html" class="bg-gray-800 text-white px-3 py-1 rounded font-bold text-sm">← Dashboard</a><a href="upload.html" class="bg-blue-600 text-white px-3 py-1 rounded font-bold text-sm">📤 Upload Books</a><a href="index.html" class="bg-black text-white px-3 py-1 rounded font-bold text-sm">🏠 Lending Page</a></div>
<div class="max-w-6xl mx-auto px-3 pb-6"><div class="grid grid-cols-4 gap-2 text-center"><div class="bg-white rounded p-3"><div class="text-xs">TOTAL STOCK</div><b id="cTotal" class="text-xl">0</b></div><div class="bg-white rounded p-3"><div class="text-xs">AVAILABLE</div><b id="cAvail" class="text-xl text-green-600">0</b></div><div class="bg-white rounded p-3"><div class="text-xs">ISSUED OUT</div><b id="cOut" class="text-xl text-orange-600">0</b></div><div class="bg-white rounded p-3"><div class="text-xs">STAFF</div><b id="cStaff" class="text-xl">0</b></div></div>
<div class="bg-white rounded-xl shadow p-4 mt-3"><div class="font-bold">➕ Add New Book</div><div class="grid grid-cols-2 md:grid-cols-3 gap-2 mt-2"><input id="bTitle" placeholder="Title" class="border rounded-lg px-3 py-2"><select id="bDept" class="border rounded-lg px-3 py-2"><option>Commerce</option><option>Mathematics</option><option>Sciences</option><option>Languages</option><option>Humanities</option><option>Technology</option></select><input id="bSubject" placeholder="Subject" class="border rounded-lg px-3 py-2"><input id="bCode" placeholder="Book No e.g. WHS-001" class="border rounded-lg px-3 py-2"><input id="bQty" type="number" value="1" class="border rounded-lg px-3 py-2"><input id="bPrice" type="number" placeholder="Price R" class="border rounded-lg px-3 py-2"></div><button onclick="addBook()" class="bg-blue-950 text-white px-4 py-2 rounded-lg font-bold mt-2">✅ Add Book</button><p id="bookMsg" class="text-green-600 font-bold text-sm mt-1"></p></div>
<div class="bg-white rounded-xl shadow p-4 mt-3"><div class="font-bold">📖 Issue / ↩️ Return</div><div class="grid grid-cols-2 gap-2 mt-2"><select id="iBook" class="border rounded-lg px-3 py-2"></select><input id="iLearner" placeholder="Learner Name" class="border rounded-lg px-3 py-2"><input id="iClass" placeholder="Class" class="border rounded-lg px-3 py-2"><select id="iTeacher" class="border rounded-lg px-3 py-2"></select></div><div class="flex gap-2 mt-2"><button onclick="issueBook()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold">📖 Issue</button><button onclick="showReturn()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold">↩️ Return View</button></div><p id="issueMsg" class="text-green-600 font-bold text-sm mt-1"></p><div id="returnBox" class="hidden mt-2"><select id="rBook" class="border rounded-lg px-3 py-2 w-full"></select><button onclick="returnBook()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold mt-2">↩️ Mark Returned</button></div></div>
<div class="bg-white rounded-xl shadow p-4 mt-3"><div class="font-bold">📚 All Stock</div><input id="search" oninput="render()" placeholder="🔍 Search..." class="border rounded-lg px-3 py-2 w-full mt-2"><div id="bookList" class="mt-2 text-sm"></div></div></div>
<script>
document.getElementById('badge').textContent='🏫 '+window.SCHOOL_NAME+' • EMIS: '+window.EMIS;
let ltsm=SGET('makhanani_ltsm',[]); let issues=SGET('makhanani_issues',[]);
function getStaff(){ let s=SGET('makhanani_staff',[]); let t=SGET('makhanani_teachers',[]); let all=[...s]; t.forEach(x=>{ if(!all.find(a=>a.name==x.name)) all.push({name:x.name,role:'Teacher',dept:x.dept}); }); return all; }
function fillTeachers(){ let sel=document.getElementById('iTeacher'); let staff=getStaff(); sel.innerHTML='<option value="">-- Teacher --</option>'+staff.map(s=>'<option value="'+s.name+'">'+s.name+' — '+s.dept+'</option>').join(''); document.getElementById('cStaff').textContent=staff.length; }
function addBook(){ let title=document.getElementById('bTitle').value.trim(); if(!title){ alert('Enter title'); return; } let dept=document.getElementById('bDept').value; let subj=document.getElementById('bSubject').value.trim()||title; let code=document.getElementById('bCode').value.trim()||('WHS-'+Math.floor(Math.random()*9000+100)); let qty=parseInt(document.getElementById('bQty').value)||1; let price=parseFloat(document.getElementById('bPrice').value)||0; let ex=ltsm.find(x=>x.title==title&&x.dept==dept); if(!ex){ ex={title,dept,subject:subj,price,copies:[]}; ltsm.push(ex); } for(let i=0;i<qty;i++) ex.copies.push({bookNo:qty>1?code+'-'+(i+1):code,barcode:qty>1?code+'-'+(i+1):code,status:'Available',learner:''}); SSET('makhanani_ltsm',ltsm); document.getElementById('bookMsg').textContent='✅ Added '+title+' — Now visible in Super Admin + Dashboard too'; fillIssue(); render(); }
function fillIssue(){ let sel=document.getElementById('iBook'); let avail=[]; ltsm.forEach((it,idx)=>{ it.copies.forEach((c,ci)=>{ if(c.status=='Available') avail.push({idx,ci,bookNo:c.bookNo||c.barcode,title:it.title}); }); }); sel.innerHTML=avail.length==0?'<option value="">No books</option>':avail.map(a=>'<option value="'+a.idx+'|'+a.ci+'">'+a.title+' — '+a.bookNo+'</option>').join(''); }
function issueBook(){ let v=document.getElementById('iBook').value; let learner=document.getElementById('iLearner').value.trim(); let cls=document.getElementById('iClass').value.trim(); let teacher=document.getElementById('iTeacher').value; if(!v||!learner){ alert('Select book + learner'); return; } let [idx,ci]=v.split('|'); let it=ltsm[idx]; let copy=it.copies[ci]; copy.status='Issued'; copy.learner=learner; let bookNo=copy.bookNo||copy.barcode; issues.push({bookNo:bookNo,barcode:bookNo,title:it.title,book:it.title,learner,learnerId:'',class:cls,teacher:teacher||'Librarian',dept:it.dept||it.subject,subject:it.subject||'',date:new Date().toLocaleDateString(),returned:false,action:'Issued'}); SSET('makhanani_ltsm',ltsm); SSET('makhanani_issues',issues); document.getElementById('issueMsg').textContent='✅ Issued to '+learner; fillIssue(); render(); }
function showReturn(){ let box=document.getElementById('returnBox'); box.classList.toggle('hidden'); let sel=document.getElementById('rBook'); let out=issues.filter(x=>!x.returned); sel.innerHTML=out.length==0?'<option>No outstanding</option>':out.map(x=>{ let idx=issues.indexOf(x); return '<option value="'+idx+'">'+(x.title||x.book)+' — '+(x.bookNo||x.barcode)+' — '+x.learner+'</option>'; }).join(''); }
function returnBook(){ let idx=document.getElementById('rBook').value; if(idx=='') return; let iss=issues[idx]; iss.returned=true; iss.action='Returned'; for(let it of ltsm){ let c=it.copies.find(x=>(x.bookNo||x.barcode)===(iss.bookNo||iss.barcode)); if(c){ c.status='Available'; c.learner=''; } } SSET('makhanani_ltsm',ltsm); SSET('makhanani_issues',issues); document.getElementById('issueMsg').textContent='✅ Returned from '+iss.learner; showReturn(); fillIssue(); render(); }
function render(){ let q=(document.getElementById('search').value||'').toLowerCase(); let total=0,avail=0; ltsm.forEach(it=>it.copies.forEach(c=>{ total++; if(c.status=='Available') avail++; })); document.getElementById('cTotal').textContent=total; document.getElementById('cAvail').textContent=avail; document.getElementById('cOut').textContent=issues.filter(x=>!x.returned).length; let rows=[]; ltsm.forEach(it=>{ it.copies.forEach(c=>{ if((it.title+' '+(c.bookNo||c.barcode)+' '+it.dept).toLowerCase().includes(q)) rows.push({it,c}); }); }); document.getElementById('bookList').innerHTML=rows.length==0?'<p class="text-gray-500">No books yet. Upload in upload.html</p>':rows.slice(0,200).map(r=>'<div class="bg-gray-50 rounded p-2 mt-1"><b>'+r.it.title+'</b> — '+(r.c.bookNo||r.c.barcode)+' — '+r.it.dept+' — '+(r.c.status=='Available'?'<span class="text-green-600 font-bold">Available</span>':'<span class="text-red-600 font-bold">Issued to '+r.c.learner+'</span>')+'</div>').join(''); }
fillTeachers(); fillIssue(); render();
</script></body></html>
