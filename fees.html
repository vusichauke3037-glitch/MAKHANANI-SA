<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fees — Wordsworth High School • MAKHANANI-LTSM</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script></head>
<body class="bg-gray-100 p-4 md:p-8"><div id="nav"></div>
<h1 class="text-2xl font-black">💰 Fees</h1><p class="text-sm text-gray-500">Wordsworth High School • MAKHANANI-LTSM • <span class="firebase-badge"><span class="bg-yellow-100 text-yellow-700 px-2 py-1 rounded-full text-xs">● Offline</span></span></p>
<div class="grid grid-cols-3 gap-4 mt-4"><div class="bg-white p-4 rounded-2xl text-center"><p id="totDue" class="text-2xl font-black">R0</p><p class="text-xs">Invoiced</p></div><div class="bg-white p-4 rounded-2xl text-center"><p id="totPaid" class="text-2xl font-black text-green-600">R0</p><p class="text-xs">Paid</p></div><div class="bg-white p-4 rounded-2xl text-center"><p id="totOut" class="text-2xl font-black text-red-600">R0</p><p class="text-xs">Outstanding</p></div></div>
<div class="bg-white p-5 rounded-2xl mt-4"><h3 class="font-bold mb-3">+ Add Fee</h3><div class="grid md:grid-cols-4 gap-3"><select id="fStudent" class="border rounded-lg px-3 py-2"></select><select id="fType" class="border rounded-lg px-3 py-2"><option>Tuition - Term 1</option><option>Tuition - Term 2</option><option>Registration</option><option>Transport</option><option>Uniform</option><option>LTSM Lost Book Fine</option></select><input id="fAmount" type="number" value="2500" class="border rounded-lg px-3 py-2"><button onclick="saveFee()" class="bg-blue-900 text-white px-4 py-2 rounded-lg text-sm">Create Fee → Syncs 🔥</button></div></div>
<div class="bg-white rounded-2xl mt-4 overflow-x-auto"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-4 text-left">Learner</th><th class="p-4 text-left">Type</th><th class="p-4 text-left">Total</th><th class="p-4 text-left">Paid</th><th class="p-4 text-left">Balance</th><th class="p-4 text-left">Status</th><th class="p-4 text-left">Action</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="bg-white p-5 rounded-2xl mt-4"><h3 class="font-bold mb-3">Recent Payments</h3><div id="payList" class="text-sm"></div></div>
<div id="footer"></div>
<script src="shared.js"></script><script src="firebase.js"></script>
<script>
  if(!checkPageAccess('fees.html')) throw new Error('Blocked');
  startFirebaseSync();
  document.getElementById('nav').innerHTML=renderNav('fees.html');
  document.getElementById('footer').innerHTML=renderFooter();
  function render(){ document.getElementById('fStudent').innerHTML=users.filter(u=>u.role==='Student').map(s=>`<option value="${s.id}">${s.name} (${s.sid}) — ${s.grade} ${s.classLetter}</option>`).join(''); document.getElementById('tbody').innerHTML=fees.map(f=>{ let bal=f.total-f.paid; return `<tr class="border-t"><td class="p-4 font-semibold">${f.studentName}</td><td class="p-4">${f.type}</td><td class="p-4">R${f.total.toLocaleString()}</td><td class="p-4 text-green-600">R${f.paid.toLocaleString()}</td><td class="p-4 font-bold ${bal>0?'text-red-600':'text-green-600'}">R${bal.toLocaleString()}</td><td class="p-4">${getFeeStatus(f)}</td><td class="p-4"><button onclick="pay(${f.id})" class="text-green-600 mr-2 ${bal===0?'opacity-30 pointer-events-none':''}">Pay</button><button onclick="del(${f.id})" class="text-red-500">Delete</button></td></tr>`; }).join(''); let td=fees.reduce((s,f)=>s+f.total,0), tp=fees.reduce((s,f)=>s+f.paid,0); document.getElementById('totDue').textContent='R'+td.toLocaleString(); document.getElementById('totPaid').textContent='R'+tp.toLocaleString(); document.getElementById('totOut').textContent='R'+(td-tp).toLocaleString(); document.getElementById('payList').innerHTML=payments.slice(-5).reverse().map(p=>`<div class="flex justify-between bg-gray-50 p-3 rounded-lg mb-2"><span><b>${p.studentName}</b> • ${p.method} • ${p.ref}</span><b class="text-green-600">+R${p.amount.toLocaleString()}</b></div>`).join('')||'No payments'; }
  function saveFee(){ let sid=+document.getElementById('fStudent').value, amt=+document.getElementById('fAmount').value; if(!amt) return alert('Enter amount'); let stu=users.find(u=>u.id===sid); fees.push({id:Date.now(),studentId:sid,studentName:stu?stu.name:'',type:document.getElementById('fType').value,total:amt,paid:0,due:new Date().toISOString().slice(0,10)}); saveAll(); render(); alert('✅ Fee created — Synced 🔥'); }
  function pay(feeId){ let amt=+prompt('Payment amount R?',''); if(!amt) return; let fee=fees.find(f=>f.id===feeId); fee.paid+=amt; payments.push({id:Date.now(),feeId,studentName:fee.studentName,amount:amt,method:'Cash',ref:'MAK-'+(1000+payments.length+1),date:new Date().toISOString().slice(0,10)}); saveAll(); render(); alert('✅ Payment recorded — Receipt: MAK-'+(1000+payments.length)); }
  function del(id){ if(confirm('Delete fee?')){ fees=fees.filter(f=>f.id!==id); saveAll(); render(); } }
  render(); window.onFirebaseUpdate = render;
</script></body></html>
